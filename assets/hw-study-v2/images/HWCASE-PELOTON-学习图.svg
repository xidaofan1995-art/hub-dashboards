<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="22" fill="#f3f5f8"/><text x="48" y="52" fill="#4e6278" font-family="Microsoft YaHei, sans-serif" font-size="20">HWCASE-PELOTON · 2021-05-05 · 学习示意图（非产品实拍）</text><text x="48" y="105" fill="#172b40" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700">Peloton Tread+：把家庭环境纳入安全边界</text><rect x="48" y="145" width="1104" height="260" rx="16" fill="#fff"/><text x="78" y="188" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#315f89">使用安全：事实 → 分析 → 验证</text><text x="78" y="238" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#172b40">同一系列不同失效模式必须分别定义风险场景和补救方案。</text><text x="48" y="453" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#685133">证据边界</text><text x="48" y="489" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#685133">不能混淆Tread与Tread+，也不能用该历史公告判断最新补救安排；未获得</text><text x="48" y="518" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#685133">完整设计验证和内部上报时间线。</text><text x="48" y="596" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#667585">AI教学归纳 · 原始来源与问题映射见案例正文 · 核对日期2026-11-03</text></svg>