<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="22" fill="#f3f5f8"/><text x="48" y="52" fill="#4e6278" font-family="Microsoft YaHei, sans-serif" font-size="20">HWCASE-IKEA · 2024-09—2025-07 · 学习示意图（非产品实拍）</text><text x="48" y="105" fill="#172b40" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700">IKEA DIRIGERA：从Matter桥接到控制器</text><rect x="48" y="145" width="1104" height="260" rx="16" fill="#fff"/><text x="78" y="188" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#315f89">互联标准：事实 → 分析 → 验证</text><text x="78" y="238" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#172b40">标准迁移可以保留既有设备价值，但桥接器与控制器承担不同角色</text><text x="78" y="279" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#172b40">。</text><text x="48" y="453" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#685133">证据边界</text><text x="48" y="489" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#685133">官方旧FAQ仍描述灯具测试版，不能拿它覆盖较新的新闻稿；本卡未验证具体固件、</text><text x="48" y="518" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#685133">地区与第三方设备的实际互通。</text><text x="48" y="596" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#667585">AI教学归纳 · 原始来源与问题映射见案例正文 · 核对日期2026-11-03</text></svg>