<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="22" fill="#f3f5f8"/><text x="48" y="52" fill="#4e6278" font-family="Microsoft YaHei, sans-serif" font-size="20">HWCASE-HUMANE · 2025-02-18 · 学习示意图（非产品实拍）</text><text x="48" y="105" fill="#172b40" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700">HP与Humane：AI能力、人才和资产组合</text><rect x="48" y="145" width="1104" height="260" rx="16" fill="#fff"/><text x="78" y="188" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#315f89">资源与组合：事实 → 分析 → 验证</text><text x="78" y="238" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#172b40">产品形态与底层技术资产可以分开评估；自研、合作与收购具有不</text><text x="78" y="279" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#172b40">同风险结构。</text><text x="48" y="453" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#685133">证据边界</text><text x="48" y="489" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#685133">该来源是协议公告，不能据此确认交易完成、AI Pin销量或停服情况；也不能将</text><text x="48" y="518" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#685133">收购价格等同于单款产品价值。</text><text x="48" y="596" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#667585">AI教学归纳 · 原始来源与问题映射见案例正文 · 核对日期2026-11-03</text></svg>