<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="22" fill="#f3f5f8"/><text x="48" y="52" fill="#4e6278" font-family="Microsoft YaHei, sans-serif" font-size="20">HWCASE-XBOX · 2018-05-17 · 学习示意图（非产品实拍）</text><text x="48" y="105" fill="#172b40" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700">Xbox Adaptive Controller：与目标用户共同设计</text><rect x="48" y="145" width="1104" height="260" rx="16" fill="#fff"/><text x="78" y="188" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#315f89">包容性设计：事实 → 分析 → 验证</text><text x="78" y="238" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#172b40">特殊需求要由目标使用者参与定义，平台接口可容纳多种能力差异</text><text x="78" y="279" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#172b40">。</text><text x="48" y="453" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#685133">证据边界</text><text x="48" y="489" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#685133">官方设计叙述不等于覆盖所有残障群体；未获得代表性样本和长期使用成效，不能声称</text><text x="48" y="518" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#685133">人人适用。</text><text x="48" y="596" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#667585">AI教学归纳 · 原始来源与问题映射见案例正文 · 核对日期2026-11-03</text></svg>