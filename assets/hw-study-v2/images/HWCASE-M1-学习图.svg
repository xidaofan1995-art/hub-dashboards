<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="22" fill="#f3f5f8"/><text x="48" y="52" fill="#4e6278" font-family="Microsoft YaHei, sans-serif" font-size="20">HWCASE-M1 · 2020-11-10 · 学习示意图（非产品实拍）</text><text x="48" y="105" fill="#172b40" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700">Apple M1：芯片、系统与应用共同迁移</text><rect x="48" y="145" width="1104" height="260" rx="16" fill="#fff"/><text x="78" y="188" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#315f89">系统架构：事实 → 分析 → 验证</text><text x="78" y="238" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#172b40">性能、功耗与软件兼容性需要作为同一系统目标评审。</text><text x="48" y="453" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#685133">证据边界</text><text x="48" y="489" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#685133">发布稿中的性能比较来自厂商指定测试，不能外推到所有应用；没有读取内部项目预算</text><text x="48" y="518" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#685133">与决策记录。</text><text x="48" y="596" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#667585">AI教学归纳 · 原始来源与问题映射见案例正文 · 核对日期2026-11-03</text></svg>