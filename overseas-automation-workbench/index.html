<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>出海自动化工作台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: port-office console — a narrow manifest rail on the left, working desk on the right, buyer time zones as a strip across the top */
:root{
  --bg:#ECEFED; --surface:#F8FAF9; --surface-2:#E2E7E4; --ink:#13202A; --muted:#58676F; --line:#C9D1CE;
  --accent:#D9480F; --accent-ink:#FFFFFF; --sea:#1D5C86; --sea-soft:#D6E4EE;
  --ok:#2F7D4F; --warn:#9A6512; --bad:#B42318; --ok-soft:#DCEFE3; --warn-soft:#F5E8CF; --bad-soft:#F7DEDB; --acc-soft:#F8DDD0;
  --f-display:"Barlow Condensed","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1519; --surface:#151F25; --surface-2:#1C2830; --ink:#E4EAED; --muted:#93A3AB; --line:#2A3740;
  --accent:#FF7A3D; --accent-ink:#1A0E07; --sea:#6AB0DB; --sea-soft:#1B3242;
  --ok:#5CC48A; --warn:#E3B04B; --bad:#F2766B; --ok-soft:#173527; --warn-soft:#3A2E14; --bad-soft:#3D1D1A; --acc-soft:#3E2112;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1519; --surface:#151F25; --surface-2:#1C2830; --ink:#E4EAED; --muted:#93A3AB; --line:#2A3740;
  --accent:#FF7A3D; --accent-ink:#1A0E07; --sea:#6AB0DB; --sea-soft:#1B3242;
  --ok:#5CC48A; --warn:#E3B04B; --bad:#F2766B; --ok-soft:#173527; --warn-soft:#3A2E14; --bad-soft:#3D1D1A; --acc-soft:#3E2112;
  color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--sea)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh;
  padding-left:max(0px, env(safe-area-inset-left,0px));padding-right:max(0px, env(safe-area-inset-right,0px))}
.rail{background:var(--ink);color:var(--bg);padding:22px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-display);font-size:26px;letter-spacing:.02em;line-height:1.05}
.brand span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;opacity:.65;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:var(--r);color:inherit;text-decoration:none;opacity:.78}
.nav a:hover{opacity:1;background:color-mix(in srgb,var(--bg) 10%,transparent)}
.nav a[aria-current="page"]{opacity:1;background:var(--accent);color:var(--accent-ink);font-weight:500}
.nav a small{font-family:var(--f-mono);font-size:11px;opacity:.75}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:12px;opacity:.8}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
.dot.on{background:var(--ok)} .dot.warn{background:var(--warn)}

.main{min-width:0;padding-block:20px 48px;padding-left:max(16px, 28px);padding-right:max(16px, env(safe-area-inset-right,0px), 28px);display:flex;flex-direction:column;gap:22px}
.clocks{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.clock{flex:0 0 auto;display:flex;flex-direction:column;gap:0;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:92px}
.clock .c-city{font-size:11.5px;color:var(--muted)}
.clock .c-time{font-family:var(--f-mono);font-size:15px;font-weight:500}
.clock .c-st{font-size:10.5px;letter-spacing:.04em}
.clock.open{border-color:var(--ok);background:var(--ok-soft)} .clock.open .c-st{color:var(--ok)}
.clock .c-st{color:var(--muted)}

.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.page-head h1{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
.page-head p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:var(--r);cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{margin:0;font-size:15px;font-weight:700}
.panel-b{padding:14px 16px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.kpi{padding:14px 16px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.kpi:first-child{border-left:0}
.kpi .k-l{font-size:12px;color:var(--muted)}
.kpi .k-v{font-family:var(--f-display);font-weight:600;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .k-s{font-size:11.5px;color:var(--muted)}
.kpi.hot .k-v{color:var(--accent)}

.pipe{display:flex;height:30px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.pipe span{display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11.5px;color:#fff;min-width:0;overflow:hidden}
.pipe-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.pipe-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.grid-2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.routine{list-style:none;margin:0;padding:0}
.routine li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}
.routine li:first-child{border-top:0}
.routine input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.routine .r-t{font-weight:500}
.routine .r-d{font-size:12.5px;color:var(--muted)}
.routine li.done .r-t{text-decoration:line-through;color:var(--muted)}
.progress{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;width:120px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 8px;border-radius:999px;white-space:nowrap;font-weight:500}
.st-new{background:var(--surface-2);color:var(--muted)}
.st-contacted{background:var(--sea-soft);color:var(--sea)}
.st-replied{background:var(--warn-soft);color:var(--warn)}
.st-quoting{background:var(--acc-soft);color:var(--accent)}
.st-won{background:var(--ok-soft);color:var(--ok)}
.st-lost{background:var(--bad-soft);color:var(--bad)}
.tag-ex{font-family:var(--f-mono);font-size:10px;padding:0 5px;border:1px dashed var(--muted);border-radius:3px;color:var(--muted);margin-left:6px;vertical-align:1px}
.due{color:var(--bad);font-weight:500}

.follow-list{list-style:none;margin:0;padding:0}
.follow-list li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
.follow-list li:first-child{border-top:0}
.follow-list .f-who{min-width:0}
.follow-list .f-who b{font-weight:500}
.follow-list .f-meta{font-size:12px;color:var(--muted)}
.empty{padding:22px 16px;color:var(--muted);font-size:13px}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .grow{flex:1 1 200px;min-width:0}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=search],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px}
textarea{resize:vertical;min-height:84px;line-height:1.55}
select{cursor:pointer}
.toolbar select{width:auto}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{text-align:left;padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:.04em;border-top:0;background:var(--surface-2)}
td .co{font-weight:500}
td .sub{font-size:12px;color:var(--muted)}
td select{padding:3px 6px;font-size:12.5px;width:auto}
.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.row-acts{display:flex;gap:6px;justify-content:flex-end}

.flows{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.flow-card{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:11px 13px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.flow-card:hover{border-color:var(--ink)}
.flow-card[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.flow-card .fc-stage{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.flow-card b{font-size:14.5px}
.flow-card span{font-size:12.5px;color:var(--muted);line-height:1.45}
.workbench{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px;align-items:start}
.form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12.5px;font-weight:500}
.field .hint{font-size:11.5px;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px;font-size:13px}
.out{min-height:320px;max-height:70vh;overflow:auto;padding:16px 18px;line-height:1.7}
.out h4{margin:14px 0 4px;font-size:14.5px}
.out h4:first-child{margin-top:0}
.out p{margin:0 0 8px}
.out ul{margin:0 0 8px;padding-left:20px}
.out hr{border:0;border-top:1px dashed var(--line);margin:12px 0}
.out .placeholder{color:var(--muted)}
.out-acts{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-top:1px solid var(--line)}
.note{font-size:12.5px;color:var(--muted)}
.note.err{color:var(--bad)}

.lib{display:flex;flex-direction:column}
.lib-item{border-top:1px solid var(--line)}
.lib-item:first-child{border-top:0}
.lib-item summary{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:11px 16px;cursor:pointer;list-style:none}
.lib-item summary::-webkit-details-marker{display:none}
.lib-item summary b{font-weight:500;flex:1 1 220px;min-width:0}
.lib-item .lib-body{padding:0 16px 14px}
.lib-item .lib-body .out{min-height:0;max-height:none;padding:12px 14px;background:var(--bg);border-radius:var(--r);border:1px solid var(--line)}

.play{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.phase{display:flex;flex-direction:column}
.phase .ph-n{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;color:var(--accent)}
.phase h3{margin:4px 0 2px;font-size:16px}
.phase p{margin:0 0 10px;font-size:13px;color:var(--muted)}
.phase ul{margin:0;padding-left:18px;font-size:13px}
.phase li{margin-bottom:5px}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0}
.links a{display:flex;flex-direction:column;padding:10px 16px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.links a:hover b{color:var(--accent)}
.links a b{font-weight:500}
.links a span{font-size:12px;color:var(--muted)}
.flowmap{font-family:var(--f-mono);font-size:12.5px;line-height:1.9;overflow-x:auto;white-space:pre;padding:14px 16px;margin:0;background:var(--bg);border-radius:var(--r);border:1px solid var(--line)}

.lines-edit{display:flex;flex-direction:column;gap:14px}
.line-block{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}

dialog{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,16,20,.45)}
dialog form{padding:18px;display:flex;flex-direction:column;gap:12px}
dialog h3{margin:0;font-size:17px}
.dlg-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg-acts .left{margin-right:auto}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:var(--r);font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}

@media (max-width: 980px){
  .grid-2,.workbench{grid-template-columns:minmax(0,1fr)}
  .play{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 760px){
  .app{grid-template-columns:minmax(0,1fr);align-content:start}
  .rail{position:static;height:auto;padding:14px max(16px, env(safe-area-inset-left,0px)) 10px max(16px, env(safe-area-inset-right,0px));gap:10px}
  .rail-foot{display:none}
  .brand{flex-direction:row;align-items:baseline;gap:10px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav a{flex:0 0 auto}
  .nav a small{display:none}
  .main{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .row{grid-template-columns:minmax(0,1fr)}
  .page-head h1{font-size:32px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><b>出海工作台</b><span>OPC · Export Desk</span></div>
    <nav class="nav" id="nav">
      <a href="#today" data-v="today">今日作战 <small id="nav-due"></small></a>
      <a href="#leads" data-v="leads">潜客管道 <small id="nav-leads"></small></a>
      <a href="#flows" data-v="flows">AI 工作流 <small>7</small></a>
      <a href="#library" data-v="library">素材库 <small id="nav-lib"></small></a>
      <a href="#playbook" data-v="playbook">自动化蓝图</a>
      <a href="#profile" data-v="profile">我的业务</a>
    </nav>
    <div class="rail-foot">
      <div><span class="dot" id="store-dot"></span><span id="store-label">连接存储中…</span></div>
      <div id="ai-label"><span class="dot"></span>AI：首次运行时授权</div>
    </div>
  </aside>

  <main class="main">
    <div class="clocks" id="clocks" aria-label="买家所在时区"></div>
    <section id="view"></section>
  </main>
</div>

<dialog id="lead-dlg">
  <form id="lead-form" method="dialog">
    <h3 id="lead-dlg-title">新增潜客</h3>
    <div class="row">
      <div class="field"><label for="lf-company">公司</label><input type="text" id="lf-company" required placeholder="如 Müller Befestigungstechnik GmbH"></div>
      <div class="field"><label for="lf-country">国家/地区</label><input type="text" id="lf-country" placeholder="德国"></div>
    </div>
    <div class="row">
      <div class="field"><label for="lf-contact">联系人 / 职位</label><input type="text" id="lf-contact" placeholder="Jonas Weber · Purchasing Manager"></div>
      <div class="field"><label for="lf-email">邮箱</label><input type="email" id="lf-email" placeholder="name@company.com"></div>
    </div>
    <div class="row">
      <div class="field"><label for="lf-line">业务线</label><select id="lf-line"></select></div>
      <div class="field"><label for="lf-stage">阶段</label><select id="lf-stage"></select></div>
    </div>
    <div class="row">
      <div class="field"><label for="lf-source">来源</label><input type="text" id="lf-source" placeholder="海关数据 / LinkedIn / 展会 / 询盘"></div>
      <div class="field"><label for="lf-value">预估年采购额 (USD)</label><input type="number" id="lf-value" min="0" step="1000" placeholder="50000"></div>
    </div>
    <div class="field"><label for="lf-next">下次跟进日期</label><input type="date" id="lf-next"></div>
    <div class="field"><label for="lf-notes">备注</label><textarea id="lf-notes" placeholder="需求、已发资料、对方关注点…"></textarea></div>
    <div class="dlg-acts">
      <button type="button" class="btn danger left" id="lf-del" hidden>删除</button>
      <button type="button" class="btn ghost" id="lf-cancel">取消</button>
      <button type="submit" class="btn primary" id="lf-save">保存</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ================= 常量与默认数据 ================= */
const STAGES=[["new","新线索","#7C8B93"],["contacted","已触达","#2B6E9C"],["replied","已回复","#B07A1C"],["quoting","报价/打样","#D9480F"],["won","成交","#2F7D4F"],["lost","搁置","#A2524A"]];
const STAGE_NAME=Object.fromEntries(STAGES.map(s=>[s[0],s[1]]));
const DEFAULT_PROFILE={
  company:"",me:"",signature:"",
  lines:[
    {id:"fastener",name:"精密螺丝 / 紧固件",products:"精密螺丝、非标定制紧固件",strengths:"工厂直供，可按图定制；振动盘筛选、盐雾测试",moq:"",certs:""},
    {id:"security",name:"智能安防硬件",products:"智能摄像头、智能门锁",strengths:"",moq:"",certs:""},
    {id:"hub",name:"Type-C 扩展坞",products:"六合一 Type-C 扩展坞（X-32036）",strengths:"",moq:"",certs:""}
  ]
};
const ZONES=[["洛杉矶","America/Los_Angeles"],["纽约","America/New_York"],["圣保罗","America/Sao_Paulo"],["伦敦","Europe/London"],["柏林","Europe/Berlin"],["迪拜","Asia/Dubai"],["孟买","Asia/Kolkata"],["悉尼","Australia/Sydney"]];
const ROUTINE=[
  {id:"intel",t:"看一眼目标市场",d:"用「买家市场调研」盘一个国家或一类买家",flow:"research"},
  {id:"prospect",t:"新增 5 个潜客",d:"从海关数据、LinkedIn、展商名录里挑，录进潜客管道",view:"leads"},
  {id:"outreach",t:"给新线索发开发信",d:"每封改一句个性化开头，挑对方工作时间发",flow:"coldmail"},

async function copyText(text){
  try{await navigator.clipboard.writeText(text);toast("已复制")}
  catch(e){const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand("copy")}catch(_){} ta.remove();toast(ok?"已复制":"复制失败，请手动选中文本")}

function md(t){
  const lines=h(t).split("\n");let out="",list=false;
  for(const raw of lines){
    const l=raw.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
    const li=l.match(/^\s*(?:[-*•]|\d+[.)、])\s+(.*)/);
    if(li){if(!list){out+="<ul>";list=true}out+="<li>"+li[1]+"</li>";continue}
    if(list){out+="</ul>";list=false}
    const hd=l.match(/^#{1,4}\s+(.*)/);
    if(hd)out+="<h4>"+hd[1]+"</h4>";
    else if(/^\s*-{3,}\s*$/.test(l))out+="<hr>";
    else if(l.trim())out+="<p>"+l+"</p>";
  }
  if(list)out+="</ul>";return out;
}

const state={leads:{},library:{},profile:null,daily:{done:{}},mode:"pending"};
const LS_KEY="export-desk-v1";
let db=null;
function profile(){const p=state.profile||{};return {...DEFAULT_PROFILE,...p,lines:(p.lines&&p.lines.length)?p.lines:DEFAULT_PROFILE.lines}}
function lineName(id){return (profile().lines.find(l=>l.id===id)||{}).name||"未分类"}
function setStore(mode,label){state.mode=mode;$("#store-dot").className="dot "+(mode==="cloud"?"on":mode==="local"?"warn":"");$("#store-label").textContent=label}
function loadLocal(){
  try{const raw=localStorage.getItem(LS_KEY);if(raw){const d=JSON.parse(raw);state.leads=d.leads||{};state.library=d.library||{};state.profile=d.profile||null;state.daily=(d.daily&&d.daily[today()])||{done:{}};state._dailyAll=d.daily||{}}}catch(e){}
}
function saveLocal(){
  try{const all=state._dailyAll||{};all[today()]=state.daily;localStorage.setItem(LS_KEY,JSON.stringify({leads:state.leads,library:state.library,profile:state.profile,daily:all}))}catch(e){}
}
async function save(kind,id,data){
  if(kind==="leads"||kind==="library")state[kind][id]=data;
  if(kind==="profile")state.profile=data;
  if(kind==="daily")state.daily=data;
  render();
  if(state.mode==="cloud"){
    const path=kind==="profile"?"config/profile":kind==="daily"?"daily/"+today():kind+"/"+id;
    try{await db.doc(path).set(data)}catch(e){toast(e&&e.code==="quota_exceeded"?"存储已满，请删除一些旧记录":"保存失败，请稍后再试")}
  }else saveLocal();
}
async function remove(kind,id){
  delete state[kind][id];render();
  if(state.mode==="cloud"){try{await db.doc(kind+"/"+id).delete()}catch(e){toast("删除失败，请稍后再试")}}
  else saveLocal();
}
function snapMap(snap){const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});return m}
async function initStore(){
  if(!window.claude||!window.claude.use){loadLocal();setStore("local","仅保存在本浏览器");render();return}
  let got=false;
  try{db=await window.claude.use("db")}catch(e){db=null}
  if(!db){loadLocal();setStore("local","仅保存在本浏览器");render();return}
  setStore("cloud","云端同步中…");
  const timer=setTimeout(()=>{if(!got)setStore("cloud","云端暂时连不上，稍后自动重试")},10000);
  const ok=s=>{if(!s.metadata.fromCache){got=true;clearTimeout(timer);setStore("cloud","已云端同步")}};
  const fail=e=>{clearTimeout(timer);if(e&&e.code==="revoked"){setStore("local","存储不可用")}else setStore("cloud","同步中断，刷新页面可恢复")};
  db.collection("leads").onSnapshot(s=>{state.leads=snapMap(s);ok(s);render()},fail);
  db.collection("library").onSnapshot(s=>{state.library=snapMap(s);ok(s);render()},fail);
  db.doc("config/profile").onSnapshot(s=>{state.profile=s.exists?s.data():null;ok(s);render()},fail);
  db.doc("daily/"+today()).onSnapshot(s=>{state.daily=s.exists?s.data():{done:{}};ok(s);render()},fail);
}

function flowFormHTML(f){
  const p=profile();const v=ui.vals[f.id]||{};
  const lineSel=`<div class="field"><label for="fv-line">业务线</label><select id="fv-line" data-fv="line">${p.lines.map(l=>`<option value="${h(l.id)}" ${(v.line||p.lines[0].id)===l.id?"selected":""}>${h(l.name)}</option>`).join("")}</select><span class="hint">产品、优势会从「我的业务」自动带入提示词</span></div>`;
  return lineSel+f.fields.map(x=>{
    const val=v[x.id]??(x.def??"");
    if(x.type==="textarea")return `<div class="field"><label for="fv-${x.id}">${h(x.label)}</label><textarea id="fv-${x.id}" data-fv="${x.id}" rows="${x.rows||4}" placeholder="${h(x.ph||"")}">${h(val)}</textarea></div>`;
    if(x.type==="select")return `<div class="field"><label for="fv-${x.id}">${h(x.label)}</label><select id="fv-${x.id}" data-fv="${x.id}">${x.opts.map(o=>`<option ${val===o?"selected":""}>${h(o)}</option>`).join("")}</select></div>`;
    if(x.type==="check")return `<label class="check"><input type="checkbox" id="fv-${x.id}" data-fv="${x.id}" ${val?"checked":""}> ${h(x.label)}</label>`;
    return `<div class="field"><label for="fv-${x.id}">${h(x.label)}</label><input type="text" id="fv-${x.id}" data-fv="${x.id}" placeholder="${h(x.ph||"")}" value="${h(val)}"></div>`;
  }).join("");
}
function flowVals(f){
  const p=profile();const v={...(ui.vals[f.id]||{})};
  if(!v.line)v.line=p.lines[0].id;
  f.fields.forEach(x=>{if(v[x.id]===undefined){v[x.id]=x.type==="select"?x.opts[0]:(x.def??"")}});
  return v;
}

function updateFlowOutput(){
  const out=$("#out");if(!out)return;
  if(ui.outState==="thinking"&&!ui.output)out.innerHTML=`<p class="placeholder">Claude 正在思考…（首次使用会先请你授权）</p>`;
  else if(ui.output)out.innerHTML=md(ui.output);
  else out.innerHTML=`<p class="placeholder">填好左边，点「生成」。产出会实时出现在这里。</p>`;
  const busy=ui.outState==="thinking"||ui.outState==="streaming";
  $("#stop").hidden=!busy;$("#run").disabled=busy;
  $("#copy-out").disabled=$("#save-out").disabled=!ui.output||busy;
  const n=$("#out-note");n.textContent=ui.outNote;n.className="note"+(ui.outState==="error"?" err":"");
}

const bind={
  today(){},
  leads(){
    const lq=$("#lq");lq.addEventListener("input",()=>{ui.leadQ=lq.value;clearTimeout(bind._q);bind._q=setTimeout(()=>{const pos=lq.selectionStart;render();const n=$("#lq");n.focus();n.setSelectionRange(pos,pos)},200)});

  },

    const form=$("#flow-form");
    form.addEventListener("input",e=>{const k=e.target.dataset.fv;if(!k)return;ui.vals[f.id]={...flowVals(f),[k]:e.target.type==="checkbox"?e.target.checked:e.target.value}});
    form.addEventListener("change",e=>{const k=e.target.dataset.fv;if(!k)return;ui.vals[f.id]={...flowVals(f),[k]:e.target.type==="checkbox"?e.target.checked:e.target.value}});
    form.onsubmit=e=>{e.preventDefault();runFlow()};
    $("#copy-prompt").onclick=()=>copyText(f.build(flowVals(f)));

    form.onsubmit=e=>{e.preventDefault();save("profile",null,collect());toast("已保存")};

async function runFlow(){
  const f=flowById(ui.flow);const prompt=f.build(flowVals(f));
  ui.ctl=new AbortController();ui.output="";ui.outState="thinking";ui.outNote="";updateFlowOutput();
  try{
    const s=await getSample();
    if(!s){ui.outState="error";ui.outNote="这里无法直接调用 Claude。点「复制提示词」，粘贴到 Claude 对话中使用。";updateFlowOutput();return}
    const r=await s(prompt,{signal:ui.ctl.signal,cache:false,onText:({text})=>{ui.output=text;ui.outState="streaming";if(ui.view==="flows")updateFlowOutput()}});
    ui.output=r.text;ui.outState="done";ui.outNote=r.truncated?"内容被截断了，可以减少输入后重试":"已完成";
    $("#ai-label").innerHTML='<span class="dot on"></span>AI：已连接 Claude';
  }catch(e){
    if(e&&e.text)ui.output=e.text;
    if(e&&e.code==="refused")ui.output="";
    ui.outState=e&&e.code==="cancelled"?"done":"error";ui.outNote=e&&e.code==="cancelled"?"已停止":errMsg(e);
  }
  if(ui.view==="flows")updateFlowOutput();
}

async function extractLead(){
  const f=flowById("inquiry");const v=flowVals(f);
  if(!v.text.trim()){toast("先粘贴询盘原文");return}
  const btn=$("#extract");btn.disabled=true;btn.textContent="提取中…";
  try{
    const s=await getSample();if(!s)throw {code:"not_granted"};
    const r=await s.json(`从下面的询盘中提取买家信息。只回复一个 JSON 对象：{"company":string,"contact":string,"email":string,"country":string,"interest":string}。interest 用中文概括需求（产品、数量、条款）。找不到的字段填空字符串。\n\n询盘：\n${v.text.slice(0,6000)}`,{modelTier:"quick"});
    openLead(null,{company:r.company||"",contact:r.contact||"",email:r.email||"",country:r.country||"",line:v.line,stage:"replied",source:"询盘",notes:r.interest||"",next:addDays(today(),1)});
  }catch(e){toast(errMsg(e))}
  finally{btn.disabled=false;btn.textContent="提取为潜客"}
}

/* 全局点击委托 */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-goflow],[data-follow],[data-snooze],[data-mail],[data-edit],[data-flow],[data-libcopy],[data-libdel]");if(!t)return;
  const d=t.dataset;
  if(d.act==="new-lead")openLead(null);
  else if(d.goflow){ui.flow=d.goflow;location.hash="flows";go()}
  else if(d.flow){if(ui.flow!==d.flow){ui.flow=d.flow;ui.output="";ui.outState="idle";ui.outNote="";$("#view").dataset.v="";render()}}
  else if(d.snooze){const l=state.leads[d.snooze];save("leads",d.snooze,{...l,next:addDays(today(),3),updated:Date.now()});toast("已顺延到 "+addDays(today(),3))}
  else if(d.follow||d.mail){const id=d.follow||d.mail;const l=state.leads[id];
    ui.flow=d.follow?"followup":"coldmail";
    ui.vals[ui.flow]=d.follow?{line:l.line,company:[l.company,l.contact].filter(Boolean).join(" · "),last:l.notes||""}:{line:l.line,company:l.company,country:l.country,contact:l.contact,hook:l.notes||""};
    ui.output="";ui.outState="idle";ui.outNote="";$("#view").dataset.v="";location.hash="flows";go()}
  else if(d.edit)openLead(d.edit);
  else if(d.libcopy)copyText(state.library[d.libcopy].content);
  else if(d.libdel){if(t.dataset.armed){remove("library",d.libdel);toast("已删除")}else{t.dataset.armed="1";t.textContent="确认删除";setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent="删除"}},3000)}}
});
document.addEventListener("change",e=>{
  if(e.target.dataset.rt){const done={...((state.daily&&state.daily.done)||{})};done[e.target.dataset.rt]=e.target.checked;save("daily",null,{done})}
  if(e.target.dataset.stage){const id=e.target.dataset.stage;save("leads",id,{...state.leads[id],stage:e.target.value,updated:Date.now()});toast("阶段已更新")}
});

/* 潜客弹窗 */
const dlg=$("#lead-dlg");
function openLead(id,prefill){
  ui.editId=id;const p=profile();
  const l=id?state.leads[id]:{line:p.lines[0].id,stage:"new",next:addDays(today(),2),...(prefill||{})};
  $("#lead-dlg-title").textContent=id?"编辑潜客":"新增潜客";
  $("#lf-line").innerHTML=p.lines.map(x=>`<option value="${h(x.id)}">${h(x.name)}</option>`).join("");
  $("#lf-stage").innerHTML=STAGES.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join("");
  for(const k of ["company","country","contact","email","line","stage","source","value","next","notes"])$("#lf-"+k).value=l[k]??"";
  const del=$("#lf-del");del.hidden=!id;del.textContent="删除";delete del.dataset.armed;
  try{dlg.showModal()}catch(e){dlg.setAttribute("open","")}
}
$("#lf-cancel").onclick=()=>dlg.close();
$("#lead-form").addEventListener("submit",e=>{
  e.preventDefault();
  const o={};for(const k of ["company","country","contact","email","line","stage","source","value","next","notes"])o[k]=$("#lf-"+k).value.trim();
  if(!o.company){$("#lf-company").focus();return}
  o.value=o.value?Number(o.value):0;
  const prev=ui.editId?state.leads[ui.editId]:null;
  const id=ui.editId||uid();
  save("leads",id,{...(prev||{}),...o,example:prev?!!prev.example:false,created:prev?prev.created:Date.now(),updated:Date.now()});
  dlg.close();toast(prev?"已保存":"已新增潜客");
});
$("#lf-del").onclick=e=>{const b=e.target;if(b.dataset.armed){remove("leads",ui.editId);dlg.close();toast("已删除")}else{b.dataset.armed="1";b.textContent="确认删除"}};

/* 时区条 */
function zoneInfo(tz){
  const parts=Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:tz,hour:"2-digit",minute:"2-digit",weekday:"short",hour12:false}).formatToParts(new Date()).map(p=>[p.type,p.value]));
  const hr=+parts.hour%24;const wkd=!["Sat","Sun"].includes(parts.weekday);
  return {time:parts.hour.replace("24","00")+":"+parts.minute,open:wkd&&hr>=9&&hr<18,weekend:!wkd,hr};
}
function renderClocks(){
  $("#clocks").innerHTML=ZONES.map(([c,tz])=>{const z=zoneInfo(tz);return `<div class="clock ${z.open?"open":""}"><span class="c-city">${c}</span><span class="c-time">${z.time}</span><span class="c-st">${z.open?"工作中":z.weekend?"周末":z.hr<9?"未上班":"已下班"}</span></div>`}).join("");
}

const VIEWS=["today","leads","flows","library","playbook","profile"];
function go(){const v=location.hash.slice(1);ui.view=VIEWS.includes(v)?v:"today";render();window.scrollTo(0,0)}
window.addEventListener("hashchange",go);

renderClocks();setInterval(renderClocks,30000);
go();
initStore();
getSample().then(s=>{if(!s)$("#ai-label").innerHTML='<span class="dot"></span>AI：不可用，可复制提示词'});
