更审批、验证和追溯；对机械干涉设置独立安全评审。","reflection":"看似不改变BOM的工艺操作，哪些仍需要重新验证？","source_ids":["SRC-017"],"source_kind":"外部公开案例","analysis_kind":"AI教学归纳，非用户个人经历","verified_at":"2026-11-03","export_diagram":"images/HWCASE-CYBERTRUCK-学习图.svg"},{"id":"HWCASE-FORMLABS","key":"FORMLABS","title":"Formlabs Form 1：用明确价值主张发起众筹","event_date":"2012-09-26","theme":"需求与上市","facts":"Formlabs十周年回顾确认，2012年9月26日启动Form 1 Kickstarter项目，以桌面高分辨率3D打印为价值主张，面向当时专业SLA设备门槛较高的机会。","lesson":"众筹能观察早期支持意愿，但量产与长期使用价值需要单独验证。","limits":"来源是公司2021年回顾；本卡不把筹款额当收入、交付量或盈利，也未核验每位支持者交付经历。","method":"将上市证据拆为访问、承诺支持、实际付款、生产、交付和持续使用，分别设置门槛。","reflection":"早期支持者的需求为何可能偏离普通客户？","source_ids":["SRC-018"],"source_kind":"外部公开案例","analysis_kind":"AI教学归纳，非用户个人经历","verified_at":"2026-11-03","export_diagram":"images/HWCASE-FORMLABS-学习图.svg"},{"id":"HWCASE-PRUSA","key":"PRUSA","title":"Prusa 2020面屏：开源设计与分布式快速响应","event_date":"2020-03-18","theme":"快速迭代","facts":"Prusa在疫情期间发布并持续更新开源防护面屏设计，介绍与社区协作、反馈与分布式制作的过程。","lesson":"缩短响应周期要同时管理设计版本、材料与现场反馈。","limits":"快速生产和社区参与不自动证明各地医疗合规、防护效果或所有打印件一致；面屏也不能替代所有其他防护用品。","method":"以版本号管理设计与工艺包，记录材料、装配、使用反馈和退出旧版的条件。","reflection":"当多个打印点同时生产，如何避免过期设计和未经验证的材料混用？","source_ids":["SRC-019"],"source_kind":"外部公开案例","analysis_kind":"AI教学归纳，非用户个人经历","verified_at":"2026-11-03","export_diagram":"images/HWCASE-PRUSA-学习图.svg"},{"id":"HWCASE-STEAMDECK","key":"STEAMDECK","title":"Steam Deck：维修指南成为交付的一部分","event_date":"2022起","theme":"维修生态","facts":"iFixit的Steam Deck LCD维修页提供后盖、电池等分步指南，并区分原始和后续内部设计版本，帮助识别对应维修路径。","lesson":"可维修不只取决于螺丝，还依赖文档、版本识别、工具与零件。","limits":"该页为维修服务提供者的一手指南，不代表所有配件现在有货；不同型号、修订和OLED不能混用。","method":"将序列/型号识别、拆装步骤、备件与安全要求组成售后交付清单。","reflection":"同名产品内部修订后，如何避免用户拿错维修指南？","source_ids":["SRC-020"],"source_kind":"外部公开案例","analysis_kind":"AI教学归纳，非用户个人经历","verified_at":"2026-11-03","export_diagram":"images/HWCASE-STEAMDECK-学习图.svg"},{"id":"HWCASE-PIXEL","key":"PIXEL","title":"Pixel 8：把长期支持写进路线图","event_date":"2023-10-04","theme":"生命周期规划","facts":"Google宣布Pixel 8和Pixel 8 Pro提供七年软件支持，涵盖Android系统升级、安全更新和Feature Drops，支持承诺延伸至2030年。","lesson":"版本路线图要覆盖上市后的维护资源和平台依赖。","limits":"七年是承诺窗口，不能说已完成七年维护；不据此认定其他Pixel型号政策相同或保证所有未来功能都适配。","method":"在路线图中为安全维护、OS兼容、驱动与新功能分别分配预算和退出条件。","reflection":"卖出一台硬件后，哪些成本还会持续多年？","source_ids":["SRC-021"],"source_kind":"外部公开案例","analysis_kind":"AI教学归纳，非用户个人经历","verified_at":"2026-11-03","export_diagram":"images/HWCASE-PIXEL-学习图.svg"},{"id":"HWCASE-IPHONE","key":"IPHONE","title":"iPhone 15 USB-C：接口迁移与生态兼容","event_date":"2023-09-12","theme":"接口与兼容","facts":"Apple宣布iPhone 15和15 Plus采用USB-C连接器，并介绍与Mac、iPad及更新款AirPods Pro共用线缆的使用情境。","lesson":"接口统一仍需明确数据速率、供电、配件和用户迁移边界。","limits":"本来源证明产品接口变化，不单独证明法规导致变化；连接器形状相同也不代表所有型号协议或速率相同。","method":"建立线缆、充电器、外设与传输模式兼容矩阵，将迁移说明纳入包装和客服。","reflection":"用户看到相同插口，最容易误以为哪些能力也相同？","source_ids":["SRC-022"],"source_kind":"外部公开案例","analysis_kind":"AI教学归纳，非用户个人经历","verified_at":"2026-11-03","export_diagram":"images/HWCASE-IPHONE-学习图.svg"},{"id":"HWCASE-QUALCOMM","key":"QUALCOMM","title":"Snapdragon XR2+ Gen 2：芯片、平台与参考设计协同","event_date":"2024-01-04","theme":"生态协作","facts":"Qualcomm发布XR2+ Gen 2，公告介绍与Samsung、Google合作，并提供由Goertek开发、采用Tobii眼动技术的参考设计。","lesson":"系统创新需要把芯片、OS、整机、感知与应用接口的责任说清楚。","limits":"合作和参考设计公告不等于某款终端已上市，也不证明商业成效；规格提升需在整机约束下验证。","method":"按模块建立接口契约、版本负责人、联合验收和问题升级路径。","reflection":"当芯片、系统和整机各自通过测试但用户体验失败，谁负责集成验收？","source_ids":["SRC-023"],"source_kind":"外部公开案例","analysis_kind":"AI教学归纳，非用户个人经历","verified_at":"2026-11-03","export_diagram":"images/HWCASE-QUALCOMM-学习图.svg"},{"id":"HWCASE-XBOX","key":"XBOX","title":"Xbox Adaptive Controller：与目标用户共同设计","event_date":"2018-05-17","theme":"包容性设计","facts":"Xbox公布面向行动受限玩家的Adaptive Controller，介绍与无障碍组织合作以及支持可外接输入设备的设计。","lesson":"特殊需求要由目标使用者参与定义，平台接口可容纳多种能力差异。","limits":"官方设计叙述不等于覆盖所有残障群体；未获得代表性样本和长期使用成效，不能声称人人适用。","method":"与不同动作能力的用户共同梳理任务，记录外设、姿势、布置和独立使用条件。","reflection":"某个用户完成演示是否足以证明方案覆盖目标群体？","source_ids":["SRC-024"],"source_kind":"外部公开案例","analysis_kind":"AI教学归纳，非用户个人经历","verified_at":"2026-11-03","export_diagram":"images/HWCASE-XBOX-学习图.svg"},{"id":"HWCASE-PIAI","key":"PIAI","title":"Raspberry Pi AI HAT+ 2：端侧生成式AI的边界","event_date":"2026-01-15","theme":"端侧AI","facts":"Raspberry Pi发布AI HAT+ 2，采用Hailo-10H及板载内存，面向Pi 5的端侧生成式AI；官方同时提醒端侧模型规模与云端大模型存在差异。","lesson":"评估端侧AI应以具体任务、内存、延迟、能耗与质量为单位。","limits":"厂商算力与示例不是本机实测，不能直接推导tokens/s或通用智能水平；模型可用性随软件版本变化。","method":"用同一任务集比较端侧、云端与混合架构，记录离线能力、失败模式和总成本。","reflection":"在相同隐私要求下，哪些任务值得放到端侧，哪些需要云端？","source_ids":["SRC-025"],"source_kind":"外部公开案例","analysis_kind":"AI教学归纳，非用户个人经历","verified_at":"2026-11-03","export_diagram":"images/HWCASE-PIAI-学习图.svg"},{"id":"HWCASE-GOPRO","key":"GOPRO","title":"GoPro Karma：飞行中断电与整机安全","event_date":"2016-11-08","theme":"系统安全","facts":"GoPro宣布召回Karma无人机，原因是少量设备在运行中失去供电；公告提供全额退款，当时不提供替换设备。","lesson":"跨电气、结构与控制的软件系统，需要围绕危险结果验收。","limits":"本公告未提供最终根因，不据此编造电池卡扣、固件或供应商责任；当时未报告伤害不等于没有风险。","method":"从失电危险反推供电连接、振动、装配和状态检测的验证任务；这些是教学假设，需实测。","reflection":"哪些故障必须通过硬件设计处理，无法依靠软件降级补救？","source_ids":["SRC-026"],"source_kind":"外部公开案例","analysis_kind":"AI教学归纳，非用户个人经历","verified_at":"2026-11-03","export_diagram":"images/HWCASE-GOPRO-学习图.svg"},{"id":"HWCASE-NOTE7","key":"NOTE7","title":"Galaxy Note7：替换产品仍出问题后的扩大召回","event_date":"2016-10-13","theme":"风险与纠正验证","facts":"CPSC扩大Note7召回，覆盖原设备及此前替换设备，指出锂电池过热和起火风险，并要求停止使用、关机及退款或换购。","lesson":"纠正措施也需要独立验证，不能把首次替换当作风险已经关闭。","limits":"URL含2017但公告事件日期为2016年10月13日；本卡未用该公告推断具体电池制造根因或内部管理责任。","method":"将初始事故、临时措施、纠正验证与残余风险分开记录，设置重新开放风险的触发条件。","reflection":"替换方案出现同类事件后，原放行假设应如何重新审查？","source_ids":["SRC-027"],"source_kind":"外部公开案例","analysis_kind":"AI教学归纳，非用户个人经历","verified_at":"2026-11-03","export_diagram":"images/HWCASE-NOTE7-学习图.svg"},{"id":"HWCASE-IKEA","key":"IKEA","title":"IKEA DIRIGERA：从Matter桥接到控制器","event_date":"2024-09—2025-07","theme":"互联标准","facts":"IKEA在2024年9月公告DIRIGERA通过Matter桥接既有Zigbee产品；2025年7月公告进一步介绍DIRIGERA成为Matter Controller。","lesson":"标准迁移可以保留既有设备价值，但桥接器与控制器承担不同角色。","limits":"官方旧FAQ仍描述灯具测试版，不能拿它覆盖较新的新闻稿；本卡未验证具体固件、地区与第三方设备的实际互通。","method":"区分桥接、控制、配网和自动化责任，建立按设备类型与固件版本的兼容测试表。","reflection":"支持Matter为什么不等于任意设备的全部功能都互通？","source_ids":["SRC-028","SRC-029"],"source_kind":"外部公开案例","analysis_kind":"AI教学归纳，非用户个人经历","verified_at":"2026-11-03","export_diagram":"images/HWCASE-IKEA-学习图.svg"}],"links":[{"id":"REL-001","chapter_id":1,"case_id":"HWCASE-XBOX","question_id":"1.4.1","question_title":"请描述一个你曾经负责的硬件产品项目，并说明你是如何通过市场细分来确定目标用户群体的。","question_anchor":"1.4.1 请描述一个你曾经负责的硬件产品项目，并说明你是如何通过市场细分来确定目标用户群体的。","perspective":"按能力与任务细分用户","analysis":"同属玩家的用户，动作能力、输入方式和布置环境可能完全不同。用能力与任务细分能补足只按年龄或价格的分群；参与式设计叙述只能证明合作存在，不能替代样本覆盖。","exercise":"画出三类动作能力的任务旅程，列出每类需要验证的外设和独立使用条件。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-002","chapter_id":1,"case_id":"HWCASE-ECHO","question_id":"1.2.1","question_title":"请简要说明在硬件产品开发中，用户需求分析通常包含哪些主要步骤？","question_anchor":"1.2.1 请简要说明在硬件产品开发中，用户需求分析通常包含哪些主要步骤？","perspective":"从家庭任务识别需求","analysis":"远场语音是一种交互手段。先拆解做饭、听音乐、查询等任务，再比较手机替代路径，才能判断用户愿意为哪段摩擦付费。","exercise":"为一个家庭场景写出任务、现有替代、痛点和可证伪的购买假设。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-003","chapter_id":1,"case_id":"HWCASE-OURA","question_id":"1.6.1","question_title":"请描述一个你利用户行为数据分析，发现产品设计缺陷并推动改进的实际案例。","question_anchor":"1.6.1 请描述一个你利用户行为数据分析，发现产品设计缺陷并推动改进的实际案例。","perspective":"用信号质量检验需求假设","analysis":"佩戴差异使同一传感器产生不同数据可用性。用户说“不准”可能指缺测、数值偏差或解释不可信，需要拆开研究；厂商小样本研究不能概括所有人群。","exercise":"设计访谈问题与数据字段，区分缺测、误差、佩戴不适三类问题。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-004","chapter_id":2,"case_id":"HWCASE-VISION","question_id":"2.3.1","question_title":"在进行硬件产品技术可行性评估时，你通常会考虑哪些关键的技术因素？","question_anchor":"2.3.1 在进行硬件产品技术可行性评估时，你通常会考虑哪些关键的技术因素？","perspective":"区分技术可行与任务价值","analysis":"可以实现眼手交互，并不证明目标任务足够高频或有付费价值。技术评估应同时覆盖交互、佩戴、内容和价格约束。","exercise":"写一张概念验证卡：目标任务、最大风险、最低原型、通过与终止条件。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-005","chapter_id":2,"case_id":"HWCASE-HUMANE","question_id":"2.5.6","question_title":"面对一个技术前景广阔但市场风险较高的硬件产品立项，你在决策汇报中会如何构建论证框架以争取支持？","question_anchor":"2.5.6 面对一个技术前景广阔但市场风险较高的硬件产品立项，你在决策汇报中会如何构建论证框架以争取支持？","perspective":"把AI能力与产品成立条件分开","analysis":"平台、IP和人才可以有价值，但不能反推某一独立终端的市场成立。立项材料需要分别说明技术资产和可持续用户任务。","exercise":"列出独立AI硬件相对手机的三条优势假设及各自需要的证据。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-006","chapter_id":2,"case_id":"HWCASE-FRAMEWORK","question_id":"2.3.5","question_title":"当初步技术方案在成本、性能或供应链方面存在冲突时，你会采取怎样的决策流程来平衡这些因素？","question_anchor":"2.3.5 当初步技术方案在成本、性能或供应链方面存在冲突时，你会采取怎样的决策流程来平衡这些因素？","perspective":"可升级架构的取舍","analysis":"替换主板要求机械包络、连接器和兼容性长期保持约束，可能与极致轻薄或当代最低成本冲突。这里的取舍是教学分析，未获厂商内部权重。","exercise":"用成本、厚度、可维修和升级收益比较两种架构，标明未知项。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-007","chapter_id":3,"case_id":"HWCASE-XBOX","question_id":"3.1.3","question_title":"在将用户需求转化为技术规格的过程中，如何确保需求的完整性和可追溯性？请结合一个具体案例阐述你所采用的工具或方法。","question_anchor":"3.1.3 在将用户需求转化为技术规格的过程中，如何确保需求的完整性和可追溯性？请结合一个具体案例阐述你所采用的工具或方法。","perspective":"把用户任务追溯到输入规格","analysis":"“能独立玩游戏”需展开为触发力量、可达范围、外设接口和映射设置等验收条件。让需求和验证用例双向关联。","exercise":"建立五行“用户任务→规格→用例→证据”追溯表。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-008","chapter_id":3,"case_id":"HWCASE-OURA","question_id":"3.3.2","question_title":"请描述一个你曾经处理过的复杂或模糊的用户需求，并说明你是如何通过分析将其转化为清晰、可验证的技术规格的？","question_anchor":"3.3.2 请描述一个你曾经处理过的复杂或模糊的用户需求，并说明你是如何通过分析将其转化为清晰、可验证的技术规格的？","perspective":"把“不准”变成可验证规格","analysis":"将模糊反馈拆成有效数据率、基准误差、佩戴范围和能耗，避免用一个准确率覆盖所有使用情境。","exercise":"为夜间与运动两种场景分别定义数据质量和续航验收。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-009","chapter_id":3,"case_id":"HWCASE-SONOS","question_id":"3.2.3","question_title":"在管理一个复杂硬件产品的需求池时，除了价值和成本，还有哪些关键因素会影响你对需求优先级的最终判断？请详细阐述这些因素如何影响你的决策。","question_anchor":"3.2.3 在管理一个复杂硬件产品的需求池时，除了价值和成本，还有哪些关键因素会影响你对需求优先级的最终判断？请详细阐述这些因素如何影响你的决策。","perspective":"存量用户核心任务的优先级","analysis":"改版需求池应显式包含旧功能连续性。优先级除了新功能价值，还要考虑存量设备兼容性与关键任务中断后果。","exercise":"建立含核心任务、影响用户、严重度和回归证据的需求排序表。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-010","chapter_id":4,"case_id":"HWCASE-M1","question_id":"4.4.1","question_title":"请描述一个你在硬件开发过程中需要与电子工程师和结构工程师共同协作的场景，并说明你是如何协调他们之间的沟通的。","question_anchor":"4.4.1 请描述一个你在硬件开发过程中需要与电子工程师和结构工程师共同协作的场景，并说明你是如何协调他们之间的沟通的。","perspective":"系统集成阶段的共同目标","analysis":"芯片、系统与应用迁移需要共同的工作负载和兼容性目标。分别优化局部指标可能无法获得整机体验。","exercise":"为芯片、OS、应用三方写出接口输入、输出和集成验收责任。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-011","chapter_id":4,"case_id":"HWCASE-DJI","question_id":"4.1.1","question_title":"请简要描述一个典型的硬件产品开发流程，并说明各个关键阶段的主要任务是什么？","question_anchor":"4.1.1 请简要描述一个典型的硬件产品开发流程，并说明各个关键阶段的主要任务是什么？","perspective":"上市与完整功能交付分阶段","analysis":"版本记录显示功能分批增加。开发计划要区分硬件冻结、最低可售功能、后续增强和配套版本验证。","exercise":"将三个功能放进阶段门表，列明依赖版本、验收和延期告知。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-012","chapter_id":4,"case_id":"HWCASE-FRAMEWORK","question_id":"4.2.1","question_title":"请简要说明在硬件产品开发中，电子设计和结构设计之间需要重点协调的关键接口有哪些？","question_anchor":"4.2.1 请简要说明在硬件产品开发中，电子设计和结构设计之间需要重点协调的关键接口有哪些？","perspective":"电子和结构接口冻结","analysis":"可拆换主板要求连接器、电池、散热与结构协同。模块边界一旦成为对外承诺，变更要进行兼容性回归。","exercise":"画一张主板接口图，区分稳定接口和允许代际改变的部分。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-013","chapter_id":5,"case_id":"HWCASE-PISUPPLY","question_id":"5.5.1","question_title":"在评估和选择新供应商时，除了价格因素，你还会考虑哪些关键指标来综合评估其风险与成本效益？","question_anchor":"5.5.1 在评估和选择新供应商时，除了价格因素，你还会考虑哪些关键指标来综合评估其风险与成本效益？","perspective":"把短缺与分配纳入供应风险","analysis":"采购价之外还需考虑断供对客户业务的影响。品牌公开的客户分配规则说明，交付连续性是成本效益的一部分。","exercise":"比较两类客户的停线损失、替代能力与服务承诺，提出分配原则。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-014","chapter_id":5,"case_id":"HWCASE-ANKER","question_id":"5.3.1","question_title":"请简要说明在评估供应商时，你通常会关注哪些关键的技术指标？","question_anchor":"5.3.1 请简要说明在评估供应商时，你通常会关注哪些关键的技术指标？","perspective":"从供应指标延伸到可追溯性","analysis":"召回需要核对型号和序列号。供应商评审除了来料指标，还应要求批次、检验和流向记录可连接；公告没有证明具体供应商失职。","exercise":"设计最小追溯字段：物料批次、生产批次、序列号和渠道订单。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-015","chapter_id":5,"case_id":"HWCASE-FAIRPHONE","question_id":"5.2.1","question_title":"在评估一个新硬件产品的成本时，除了物料清单（BOM）成本，你认为还有哪些关键成本因素需要考虑，并请说明理由。","question_anchor":"5.2.1 在评估一个新硬件产品的成本时，除了物料清单（BOM）成本，你认为还有哪些关键成本因素需要考虑，并请说明理由。","perspective":"BOM之外的长期支持成本","analysis":"长期软件支持与维修意味着备件、工程维护、认证和售后成本持续发生。单次BOM节省可能被后期支持成本抵消。","exercise":"列一张五年生命周期成本表，未知金额保留空白并列取数方式。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-016","chapter_id":6,"case_id":"HWCASE-NOTE7","question_id":"6.3.1","question_title":"请简要说明在硬件产品开发中，EVT、DVT和PVT这三个阶段的主要测试目标和侧重点分别是什么？","question_anchor":"6.3.1 请简要说明在硬件产品开发中，EVT、DVT和PVT这三个阶段的主要测试目标和侧重点分别是什么？","perspective":"纠正方案也需要重新验证","analysis":"扩大召回涵盖替换机，提示第一次补救不能自动关闭风险。不能据此断言具体EVT/DVT/PVT失误，但可反推各阶段应保留哪些证据。","exercise":"为替换电池或替换整机写独立验证计划和再次触发升级的条件。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-017","chapter_id":6,"case_id":"HWCASE-PELOTON","question_id":"6.2.1","question_title":"在设计一款智能家居网关的可靠性测试用例时，除了常规的高低温测试，你会考虑哪些特殊的测试场景来模拟用户真实使用环境？请列举至少三种并说明设计理由。","question_anchor":"6.2.1 在设计一款智能家居网关的可靠性测试用例时，除了常规的高低温测试，你会考虑哪些特殊的测试场景来模拟用户真实使用环境？请列举至少三种并说明设计理由。","perspective":"测试边界包含非主用户","analysis":"家庭产品还可能影响儿童、宠物与旁观者。危险场景必须覆盖实际空间和可预见误用，不只正常操作。","exercise":"列六个家庭情境，按严重度和暴露机会定义测试与防护需求。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-018","chapter_id":6,"case_id":"HWCASE-GOPRO","question_id":"6.1.1","question_title":"请简要解释硬件产品开发中EVT、DVT和PVT这三个阶段分别代表什么，以及它们各自的主要目标是什么？","question_anchor":"6.1.1 请简要解释硬件产品开发中EVT、DVT和PVT这三个阶段分别代表什么，以及它们各自的主要目标是什么？","perspective":"从危险结果反推阶段门证据","analysis":"失电对无人机的后果要求供电、装配和整机验证联动。这里推导测试方向，不假定公告已公布最终物理根因。","exercise":"分别列EVT、DVT、PVT对失电风险需要取得的一项证据。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-019","chapter_id":7,"case_id":"HWCASE-VISION","question_id":"7.4.1","question_title":"请简要说明在制定硬件产品上市推广计划时，通常需要考虑哪些关键要素？","question_anchor":"7.4.1 请简要说明在制定硬件产品上市推广计划时，通常需要考虑哪些关键要素？","perspective":"上市计划包含学习和体验交付","analysis":"新交互产品的上市节点、预订与体验说明是可观察安排；市场接受度仍需上线后验证，不能拿发布声量代替留存。","exercise":"按预订、交付、首次体验和七日复用设计上市指标。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-020","chapter_id":7,"case_id":"HWCASE-SONOS","question_id":"7.1.1","question_title":"面对产品上市初期可能出现的负面市场反馈，你会采取怎样的系统性流程来快速收集、分析并制定应对策略？","question_anchor":"7.1.1 面对产品上市初期可能出现的负面市场反馈，你会采取怎样的系统性流程来快速收集、分析并制定应对策略？","perspective":"负面反馈后的恢复顺序","analysis":"官方承认体验未达承诺后，团队需要把高严重度任务恢复放入计划。具体排序与指标是学习方案，并非公开的内部执行事实。","exercise":"制定72小时反馈分诊表，包含复现、范围、临时措施和公告负责人。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-021","chapter_id":7,"case_id":"HWCASE-FORMLABS","question_id":"7.4.1","question_title":"请简要说明在制定硬件产品上市推广计划时，通常需要考虑哪些关键要素？","question_anchor":"7.4.1 请简要说明在制定硬件产品上市推广计划时，通常需要考虑哪些关键要素？","perspective":"众筹验证与量产交付分开","analysis":"明确价值主张可以吸引早期支持，但众筹关注、付款、良率和交付是不同漏斗阶段。上市计划必须跨过每个阶段。","exercise":"为众筹项目写六段漏斗，每段列证据与可能误判。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-022","chapter_id":8,"case_id":"HWCASE-SONOS","question_id":"8.1.1","question_title":"请列举三种硬件产品经理在产品上市后可以用于收集用户反馈的常用渠道，并简要说明其各自的特点。","question_anchor":"8.1.1 请列举三种硬件产品经理在产品上市后可以用于收集用户反馈的常用渠道，并简要说明其各自的特点。","perspective":"反馈渠道不是同质样本","analysis":"官方社区提供发现问题的线索，但跟帖不能直接代表总体。需连接客服、遥测与分层用户访谈，避免声量代替影响范围。","exercise":"设计跨渠道去重与分群方案，区分投诉数、受影响设备数和任务失败率。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-023","chapter_id":8,"case_id":"HWCASE-FITBIT","question_id":"8.2.1","question_title":"请简要描述当产品上市后收到用户关于质量问题的反馈时，你通常会采取哪些初步处理步骤？","question_anchor":"8.2.1 请简要描述当产品上市后收到用户关于质量问题的反馈时，你通常会采取哪些初步处理步骤？","perspective":"先按危害组织质量事件","analysis":"电池过热与烧伤反馈需要保留严重度和设备条件。没有销量及活跃设备分母时，报告数量不能充当故障率。","exercise":"把五条假设工单整理成事件表，并标明必须补充的分母与证据。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-024","chapter_id":8,"case_id":"HWCASE-NINTENDO","question_id":"8.3.1","question_title":"当产品出现质量问题时，你会如何分析质量数据以确定问题的根本原因，并据此制定产品迭代的优先级？","question_anchor":"8.3.1 当产品出现质量问题时，你会如何分析质量数据以确定问题的根本原因，并据此制定产品迭代的优先级？","perspective":"从漂移投诉到系统性改进","analysis":"围绕核心交互的重复问题，应区分磨损、环境与设计假设，再检验维修和设计变更。免费维修承诺不证明根因已消失。","exercise":"写一份漂移问题树，分别列验证方式与售后观察指标。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-025","chapter_id":9,"case_id":"HWCASE-NOTE7","question_id":"9.2.1","question_title":"请阐述在硬件产品开发中，进行风险评估与优先级排序通常需要考虑哪些基本维度？","question_anchor":"9.2.1 请阐述在硬件产品开发中，进行风险评估与优先级排序通常需要考虑哪些基本维度？","perspective":"高严重度风险的重新开放","analysis":"替换设备仍在召回范围，意味着临时措施后仍需追踪残余风险。风险排序不能只看成本或发生次数。","exercise":"建立带严重度、证据、临时措施、责任人和重开条件的风险登记册。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-026","chapter_id":9,"case_id":"HWCASE-NEST","question_id":"9.6.1","question_title":"在硬件产品开发过程中，如果某个关键元器件突然面临停产风险，你会采取哪些具体步骤来应对以确保项目顺利进行？","question_anchor":"9.6.1 在硬件产品开发过程中，如果某个关键元器件突然面临停产风险，你会采取哪些具体步骤来应对以确保项目顺利进行？","perspective":"服务终止也是依赖失效","analysis":"除了芯片停产，云端与桥接服务也可能终止。停服影响App、告警和相连设备，必须按依赖逐项核对。","exercise":"列一张停服影响表，为数据、核心功能和外围设备安排迁移。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-027","chapter_id":9,"case_id":"HWCASE-ANKER","question_id":"9.4.1","question_title":"请分享一个你在硬件产品开发中，通过风险监控机制及时发现并处理潜在问题的具体案例。","question_anchor":"9.4.1 请分享一个你在硬件产品开发中，通过风险监控机制及时发现并处理潜在问题的具体案例。","perspective":"风险触发与受影响范围","analysis":"同型号也可能按序列号界定范围。风险监控需要把事故线索连接到生产和渠道，而非只统计社交媒体提及。","exercise":"设计从过热报告到范围确认的升级流程，注明未知根因如何处理。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-028","chapter_id":10,"case_id":"HWCASE-M1","question_id":"10.4.1","question_title":"假设你需要为一个新的智能硬件产品功能进行ROI分析，请描述你通常会考虑哪些关键的成本与收益指标？","question_anchor":"10.4.1 假设你需要为一个新的智能硬件产品功能进行ROI分析，请描述你通常会考虑哪些关键的成本与收益指标？","perspective":"平台投入的收益与迁移成本","analysis":"集成芯片可能带来系统优化机会，也需要软件迁移与长期平台投入。发布规格不足以算ROI，必须列出资源和回收假设。","exercise":"建立自研平台与外购方案的ROI框架，所有金额使用待验证变量。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-029","chapter_id":10,"case_id":"HWCASE-PISUPPLY","question_id":"10.5.1","question_title":"请描述在硬件产品开发过程中，当遇到关键元器件突然短缺时，你会采取哪些初步应对措施来确保项目进度不受影响？","question_anchor":"10.5.1 请描述在硬件产品开发过程中，当遇到关键元器件突然短缺时，你会采取哪些初步应对措施来确保项目进度不受影响？","perspective":"稀缺库存的分配优先级","analysis":"官方选择优先商业和工业客户，体现对业务连续性的权重。自己的分配规则应有可解释约束，不能直接照搬他人客群。","exercise":"用停线损失、合同与生态影响给三类客户分配有限库存。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-030","chapter_id":10,"case_id":"HWCASE-HUMANE","question_id":"10.1.1","question_title":"请列举硬件产品开发中常见的三种资源类型，并简要说明它们在项目中的主要作用。","question_anchor":"10.1.1 请列举硬件产品开发中常见的三种资源类型，并简要说明它们在项目中的主要作用。","perspective":"自研、合作与收购的资源组合","analysis":"公告包含平台、人才与知识产权。比较AI产品路径时，应把资金、人力、集成时间和技术依赖分开估算。","exercise":"制作三方案决策表，为每个选项列一项最关键的不确定性。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-031","chapter_id":11,"case_id":"HWCASE-XBOX","question_id":"11.2.1","question_title":"请阐述在跨部门沟通中，你认为倾听环节最关键的是什么，并分享一个你通过有效倾听成功理解对方真实需求的例子。","question_anchor":"11.2.1 请阐述在跨部门沟通中，你认为倾听环节最关键的是什么，并分享一个你通过有效倾听成功理解对方真实需求的例子。","perspective":"有效倾听变成设计输入","analysis":"组织与用户参与让能力差异进入设计。产品经理需要把体验描述转成团队可共同验证的任务，而非替用户猜测。","exercise":"写出一次共创访谈议程及避免引导答案的三个问题。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-032","chapter_id":11,"case_id":"HWCASE-STEAMDECK","question_id":"11.1.1","question_title":"请简要阐述硬件产品经理在跨部门沟通中的主要职责是什么？","question_anchor":"11.1.1 请简要阐述硬件产品经理在跨部门沟通中的主要职责是什么？","perspective":"将维修团队纳入产品交付","analysis":"维修指南说明售后知识也是产品接口。研发变更时，文档、备件和客服需要同步版本。","exercise":"建立研发、售后、文档、零件伙伴的责任表及一次变更交接清单。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-033","chapter_id":11,"case_id":"HWCASE-QUALCOMM","question_id":"11.7.1","question_title":"请简要说明在跨部门团队协作中，你通常采取哪些措施来建立团队成员之间的信任关系？","question_anchor":"11.7.1 请简要说明在跨部门团队协作中，你通常采取哪些措施来建立团队成员之间的信任关系？","perspective":"跨公司协作依赖接口契约","analysis":"芯片、系统、整机和感知伙伴共享最终体验，却承担不同模块责任。信任需要可观察的交付与联合验收支持。","exercise":"列出五方交付物、阻塞点和集成问题升级规则。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-034","chapter_id":12,"case_id":"HWCASE-PISUPPLY","question_id":"12.4.1","question_title":"请简述在硬件产品开发中，生产计划与库存管理优化的主要目标是什么？","question_anchor":"12.4.1 请简述在硬件产品开发中，生产计划与库存管理优化的主要目标是什么？","perspective":"短缺时联动销售与生产计划","analysis":"积压与客户优先级要求销售承诺、渠道分配和生产排期保持同一口径。不能仅通过催供应商解决需求冲击。","exercise":"模拟供应减少30%的排期会，输出客户分配规则和承诺调整表。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-035","chapter_id":12,"case_id":"HWCASE-ANKER","question_id":"12.5.1","question_title":"当供应商提供的元器件批次出现质量波动时，你通常会采取哪些初步措施来快速响应和隔离问题？","question_anchor":"12.5.1 当供应商提供的元器件批次出现质量波动时，你通常会采取哪些初步措施来快速响应和隔离问题？","perspective":"按批次与序列隔离风险","analysis":"公告以型号及序列界定范围，为学习质量隔离提供对象。不能由此推定供应批次是已证实根因。","exercise":"设计待检、隔离、已出货和补救完成四类状态及转换证据。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-036","chapter_id":12,"case_id":"HWCASE-CYBERTRUCK","question_id":"12.5.1","question_title":"当供应商提供的元器件批次出现质量波动时，你通常会采取哪些初步措施来快速响应和隔离问题？","question_anchor":"12.5.1 当供应商提供的元器件批次出现质量波动时，你通常会采取哪些初步措施来快速响应和隔离问题？","perspective":"制造变更进入跨部门审批","analysis":"未批准工艺变化影响踏板保持力，说明装配辅助操作也要连接设计、制造、质量与供应链。","exercise":"写一张工艺变更申请，包含材料、风险、验证、库存和在途产品处置。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-037","chapter_id":13,"case_id":"HWCASE-SONOS","question_id":"13.1.1","question_title":"请解释在硬件产品开发中，什么是北极星指标，并说明为什么它对产品成功至关重要？","question_anchor":"13.1.1 请解释在硬件产品开发中，什么是北极星指标，并说明为什么它对产品成功至关重要？","perspective":"以核心任务衡量版本健康","analysis":"App打开次数或新界面点击并不能代表硬件体验恢复。可设计以成功完成关键任务为核心的指标，明确这是教学建议。","exercise":"定义一个核心指标及三项护栏，注明采样、分母和设备分层。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-038","chapter_id":13,"case_id":"HWCASE-AIRPODS","question_id":"13.3.1","question_title":"请列举在硬件产品开发中，你通常会关注哪些关键的数据指标来评估产品的性能表现？","question_anchor":"13.3.1 请列举在硬件产品开发中，你通常会关注哪些关键的数据指标来评估产品的性能表现？","perspective":"验证终点必须对应功能用途","analysis":"FDA公告给出特定人群与临床研究，说明健康用途不能只用日活或满意度验收。数据指标要与预期用途匹配。","exercise":"比较消费音频和助听功能的指标、样本与准入证据差异。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-039","chapter_id":13,"case_id":"HWCASE-OURA","question_id":"13.2.1","question_title":"请列举在硬件产品开发过程中，数据采集通常包含哪些关键环节，并简要说明每个环节的作用。","question_anchor":"13.2.1 请列举在硬件产品开发过程中，数据采集通常包含哪些关键环节，并简要说明每个环节的作用。","perspective":"从原始信号到用户结论","analysis":"动态感测和厂商对照研究提示，数据管线要同时记录原始质量、算法版本与适用条件。单个提升百分比缺少基准时容易误解。","exercise":"画出感测、清洗、估计、展示四阶段流程，为每段定义质量字段。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-040","chapter_id":14,"case_id":"HWCASE-PIXEL","question_id":"14.5.1","question_title":"请描述制定一个硬件产品技术路线图通常包含哪些关键步骤和组成部分。","question_anchor":"14.5.1 请描述制定一个硬件产品技术路线图通常包含哪些关键步骤和组成部分。","perspective":"路线图承载长期维护承诺","analysis":"七年支持把系统、安全和功能维护拉入路线图。应明确不同类别支持范围、资源与依赖，不能把承诺写成已实现。","exercise":"为一款硬件写上市后三年路线图，区分维护、增强和退出。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-041","chapter_id":14,"case_id":"HWCASE-NEST","question_id":"14.4.1","question_title":"请解释硬件产品生命周期成本（LCC）主要包括哪些组成部分？","question_anchor":"14.4.1 请解释硬件产品生命周期成本（LCC）主要包括哪些组成部分？","perspective":"生命周期成本包含退场","analysis":"云端运行、用户通知、数据迁移和外围依赖处理会在销售后持续产生成本。退场计划应先于最终关停决定。","exercise":"把停服迁移与用户支持列入LCC，并定义告知和验收节点。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-042","chapter_id":14,"case_id":"HWCASE-DJI","question_id":"14.1.1","question_title":"请阐述产品版本和衍生产品之间的主要区别，并各举一个例子说明。","question_anchor":"14.1.1 请阐述产品版本和衍生产品之间的主要区别，并各举一个例子说明。","perspective":"软件版本与硬件衍生款分开","analysis":"同一飞行器通过固件增加功能，与推出新硬件型号不同。版本规划必须说明硬件边界与配套App版本。","exercise":"画一个设备—固件—遥控器—App矩阵，避免“最新版本”含义模糊。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-043","chapter_id":15,"case_id":"HWCASE-AIRPODS","question_id":"15.1.1","question_title":"在产品的早期设计阶段，为了确保最终能够顺利通过目标市场的强制性认证，你作为硬件产品经理会推动团队提前考虑和规划哪些关键事项？","question_anchor":"15.1.1 在产品的早期设计阶段，为了确保最终能够顺利通过目标市场的强制性认证，你作为硬件产品经理会推动团队提前考虑和规划哪些关键事项？","perspective":"用途声明决定证据路径","analysis":"健康功能的目标人群与使用声明进入开发早期，研究终点和地区准入随之确定。美国案例只能作为方法学习。","exercise":"给一个假设健康硬件写用途边界，再列需要向合规专家确认的问题。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-044","chapter_id":15,"case_id":"HWCASE-IPHONE","question_id":"15.3.1","question_title":"请简要说明在硬件产品设计初期，为什么需要将合规性要求（如安全、EMC）纳入考虑，而不是等到产品开发后期再处理？","question_anchor":"15.3.1 请简要说明在硬件产品设计初期，为什么需要将合规性要求（如安全、EMC）纳入考虑，而不是等到产品开发后期再处理？","perspective":"标准接口与产品规格分别核对","analysis":"USB-C连接器的产品事实可以查发布稿，但法规适用、协议能力和认证范围需要各自证据。不能把相同插口等同完整兼容。","exercise":"制作连接器、协议、供电、数据速率和目标市场要求的证据清单。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-045","chapter_id":15,"case_id":"HWCASE-NINTENDO","question_id":"15.4.1","question_title":"当认证机构提出不符合项时，你会如何协调内部团队进行整改，并确保整改措施得到有效验证？","question_anchor":"15.4.1 当认证机构提出不符合项时，你会如何协调内部团队进行整改，并确保整改措施得到有效验证？","perspective":"售后承诺需要地区与问题边界","analysis":"欧盟协调行动落到具体漂移问题和维修承诺。学习整改时需将法律适用、技术修复和消费者触达分开。","exercise":"写一份历史案例整改表，明确地区、问题、承诺、验证与未核验项。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-046","chapter_id":16,"case_id":"HWCASE-PIAI","question_id":"16.3.1","question_title":"请描述一个你主导或参与过的、涉及多种技术（如AI、传感器、新材料等）融合的硬件产品案例，并重点说明你在产品架构设计阶段所扮演的角色和做出的关键决策。","question_anchor":"16.3.1 请描述一个你主导或参与过的、涉及多种技术（如AI、传感器、新材料等）融合的硬件产品案例，并重点说明你在产品架构设计阶段所扮演的角色和做出的关键决策。","perspective":"端侧AI以任务而非TOPS立项","analysis":"2026年产品给出端侧生成式AI路径，但算力不自动转成可用体验。内存、模型、能耗、散热和质量要一起评估。","exercise":"选择一个离线任务，设计端云对照测试和退出条件。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-047","chapter_id":16,"case_id":"HWCASE-VISION","question_id":"16.7.1","question_title":"请列举并简要说明，在评估一个颠覆性硬件产品的初期成功时，除了销售额和利润率，你认为还有哪三个关键的非财务指标？","question_anchor":"16.7.1 请列举并简要说明，在评估一个颠覆性硬件产品的初期成功时，除了销售额和利润率，你认为还有哪三个关键的非财务指标？","perspective":"前沿技术需要非财务验收","analysis":"在没有销量和留存证据前，可以设计任务成功、佩戴完成率和复用意愿等指标；这些指标不等于已取得结果。","exercise":"列出验证新交互的三个非财务指标及取数方法。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-048","chapter_id":16,"case_id":"HWCASE-IKEA","question_id":"16.4.1","question_title":"假设公司计划推出一款采用颠覆性技术（如新型传感器或低功耗通信协议）的智能硬件产品，请阐述你将从哪些方面进行风险评估，并制定相应的风险缓解策略。","question_anchor":"16.4.1 假设公司计划推出一款采用颠覆性技术（如新型传感器或低功耗通信协议）的智能硬件产品，请阐述你将从哪些方面进行风险评估，并制定相应的风险缓解策略。","perspective":"标准迁移中的兼容风险","analysis":"由桥接到控制器并非同一能力。新标准引入要明确角色、旧设备价值和第三方兼容范围，不能只贴协议标签。","exercise":"绘制旧Zigbee设备、桥接器、控制器和第三方平台关系图。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-049","chapter_id":17,"case_id":"HWCASE-PISUPPLY","question_id":"17.3.1","question_title":"请列举并简要说明三种提升供应链韧性的常见策略。","question_anchor":"17.3.1 请列举并简要说明三种提升供应链韧性的常见策略。","perspective":"韧性包括需求分配能力","analysis":"供应链冲击与需求增加叠加时，客户分配、可信渠道和替代产品沟通也能影响韧性。不能仅统计供应商数量。","exercise":"提出供应、需求、渠道三层缓解方案，并写出各自代价。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-050","chapter_id":17,"case_id":"HWCASE-PRUSA","question_id":"17.6.1","question_title":"请简要描述供应链危机管理预案通常应包含哪些核心组成部分？","question_anchor":"17.6.1 请简要描述供应链危机管理预案通常应包含哪些核心组成部分？","perspective":"分布式制造的应急前提","analysis":"开源文件可快速传播，但现场生产仍需要版本、材料和质量一致性。分布式响应不是天然免检。","exercise":"设计应急生产包的最小目录和一个跨生产点抽查流程。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-051","chapter_id":17,"case_id":"HWCASE-FAIRPHONE","question_id":"17.7.1","question_title":"请简要说明在硬件产品供应链管理中，ESG（环境、社会、治理）主要包含哪些核心要素？","question_anchor":"17.7.1 请简要说明在硬件产品供应链管理中，ESG（环境、社会、治理）主要包含哪些核心要素？","perspective":"ESG与支持链长期一致","analysis":"可维修与软件长支持要求备件及平台维护协同。要评估承诺如何兑现，而非用寿命愿景直接计算环境成果。","exercise":"建立“承诺—供应依赖—验证证据—年度复查”四列表。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-052","chapter_id":18,"case_id":"HWCASE-M1","question_id":"18.1.1","question_title":"请阐述在硬件产品开发中，软硬件协同设计的主要目标是什么，并列举至少两个关键优势。","question_anchor":"18.1.1 请阐述在硬件产品开发中，软硬件协同设计的主要目标是什么，并列举至少两个关键优势。","perspective":"软硬件共同优化工作负载","analysis":"统一内存与系统适配体现联合设计方向。学习时应从目标应用的瓶颈出发，而非先选芯片再寻找场景。","exercise":"为图像处理任务拆解算力、内存、传输、OS和应用瓶颈。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-053","chapter_id":18,"case_id":"HWCASE-OURA","question_id":"18.3.1","question_title":"请简要说明在硬件产品设计中，性能、功耗、成本和可靠性这四个关键指标通常存在怎样的权衡关系？","question_anchor":"18.3.1 请简要说明在硬件产品设计中，性能、功耗、成本和可靠性这四个关键指标通常存在怎样的权衡关系？","perspective":"传感精度与功耗共同约束","analysis":"动态调节感测和LED亮度可作为研究软硬件协同的入口。厂商叙述不能代替自己的误差与续航对照。","exercise":"设计两种感测策略对照表，列信号质量、功耗和人群条件。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-054","chapter_id":18,"case_id":"HWCASE-GOPRO","question_id":"18.4.1","question_title":"请简要解释什么是嵌入式系统，并列举至少两个常见的嵌入式系统应用实例。","question_anchor":"18.4.1 请简要解释什么是嵌入式系统，并列举至少两个常见的嵌入式系统应用实例。","perspective":"嵌入式系统的故障边界","analysis":"飞行中失电说明软件依赖物理供电连续性。根因未公开的部分必须保留假设，避免把控制软件当万能补救。","exercise":"做一个简化故障树，区分检测、降级、机械和电气措施。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-055","chapter_id":19,"case_id":"HWCASE-FAIRPHONE","question_id":"19.4.1","question_title":"请简要解释循环经济设计中的‘设计用于持久性’原则，并说明它在硬件产品开发中的重要性。","question_anchor":"19.4.1 请简要解释循环经济设计中的‘设计用于持久性’原则，并说明它在硬件产品开发中的重要性。","perspective":"持久性需要硬件与软件都存续","analysis":"维修设计与长期系统支持共同影响可使用寿命。实际减排还需要寿命、使用、维修与替代行为数据。","exercise":"列出证明延寿与减排分别需要的证据，避免混用承诺与结果。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-056","chapter_id":19,"case_id":"HWCASE-FRAMEWORK","question_id":"19.7.1","question_title":"在硬件产品的生命周期中，哪些阶段对环境影响最大？请阐述在产品设计初期应如何规划以降低这些影响。","question_anchor":"19.7.1 在硬件产品的生命周期中，哪些阶段对环境影响最大？请阐述在产品设计初期应如何规划以降低这些影响。","perspective":"模块替换与整机替换的边界","analysis":"可升级主板为保留其余部件提供可能，但不能直接说环境影响一定更低。需要比较升级行为和完整生命周期。","exercise":"设定功能等价条件，比较升级与换机的物料及使用阶段数据需求。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-057","chapter_id":19,"case_id":"HWCASE-STEAMDECK","question_id":"19.4.1","question_title":"请简要解释循环经济设计中的‘设计用于持久性’原则，并说明它在硬件产品开发中的重要性。","question_anchor":"19.4.1 请简要解释循环经济设计中的‘设计用于持久性’原则，并说明它在硬件产品开发中的重要性。","perspective":"维修文档降低维护门槛","analysis":"型号识别、分步指南与零件是可维修性的组成部分。公开指南不能证明用户都修得好或备件永远供应。","exercise":"为一个硬件写可维修性清单，并定义维修成功率的真实测量方式。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-058","chapter_id":20,"case_id":"HWCASE-XBOX","question_id":"20.3.1","question_title":"请简要说明在硬件产品开发中，产品需求管理通常包含哪些主要环节？","question_anchor":"20.3.1 请简要说明在硬件产品开发中，产品需求管理通常包含哪些主要环节？","perspective":"用户参与贯穿需求管理","analysis":"目标用户和组织提供情境，产品团队负责需求追溯，工程与伙伴落实接口，验收仍需目标使用者参与。","exercise":"建立一张RACI表，覆盖研究、规格、样机、适配与最终验收。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-059","chapter_id":20,"case_id":"HWCASE-QUALCOMM","question_id":"20.2.1","question_title":"请描述一下，在一个硬件产品开发项目中，你通常会如何设计跨职能团队（如硬件、软件、供应链、市场）之间的协作流程，以确保信息同步和项目进度？","question_anchor":"20.2.1 请描述一下，在一个硬件产品开发项目中，你通常会如何设计跨职能团队（如硬件、软件、供应链、市场）之间的协作流程，以确保信息同步和项目进度？","perspective":"跨组织交付需要单一集成入口","analysis":"参考设计连接多个专业团队。应明确系统负责人、接口版本和集成故障的责任，避免各模块独立通过即结束。","exercise":"写出联合评审节奏、版本基线和冲突升级机制。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-060","chapter_id":20,"case_id":"HWCASE-PRUSA","question_id":"20.7.1","question_title":"在硬件产品开发中，如何平衡敏捷迭代的需求与硬件长周期、高成本的特点？请分享你的实践经验。","question_anchor":"20.7.1 在硬件产品开发中，如何平衡敏捷迭代的需求与硬件长周期、高成本的特点？请分享你的实践经验。","perspective":"快速迭代的角色与放行","analysis":"社区反馈、设计修订和现场生产速度快，更需要区分谁可建议、谁可改版、谁可放行。公开协作不等于公开质量责任。","exercise":"为紧急制造写设计、质量、生产、现场使用者的职责和变更流程。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-061","chapter_id":21,"case_id":"HWCASE-NOTE7","question_id":"21.2.1","question_title":"在产品危机公关中，你认为与媒体沟通时最重要的基本原则是什么？","question_anchor":"21.2.1 在产品危机公关中，你认为与媒体沟通时最重要的基本原则是什么？","perspective":"危机沟通跟随风险边界更新","analysis":"扩大召回包括替换设备，沟通必须清楚修正旧措施与适用范围。美国历史案例不代替中国现行召回流程。","exercise":"写一份含型号、风险、行动和信息入口的历史召回通知练习。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-062","chapter_id":21,"case_id":"HWCASE-PELOTON","question_id":"21.3.1","question_title":"请解释在硬件产品大规模召回事件中，供应链中断可能对召回执行过程产生哪些具体影响？","question_anchor":"21.3.1 请解释在硬件产品大规模召回事件中，供应链中断可能对召回执行过程产生哪些具体影响？","perspective":"不同失效模式分别执行召回","analysis":"Tread与Tread+是两项问题，不能共用模糊原因。执行计划需分别准备识别、触达、物流与补救能力。","exercise":"制作双产品召回执行表，标出不同风险、处置与完成证据。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-063","chapter_id":21,"case_id":"HWCASE-FITBIT","question_id":"21.5.1","question_title":"请简要说明智能硬件远程诊断系统通常包含哪些核心功能模块？","question_anchor":"21.5.1 请简要说明智能硬件远程诊断系统通常包含哪些核心功能模块？","perspective":"远程诊断的作用与限制","analysis":"智能设备可以提供版本和状态线索，但公开召回没有证明可通过遥测提前预测电池故障。诊断系统能力需单独验收。","exercise":"列出遥测可以确认、只能提示和无法判断的三类信息。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-064","chapter_id":22,"case_id":"HWCASE-FRAMEWORK","question_id":"22.1.1","question_title":"请简要解释什么是硬件产品的平台化与模块化，并说明它们之间的主要区别是什么？","question_anchor":"22.1.1 请简要解释什么是硬件产品的平台化与模块化，并说明它们之间的主要区别是什么？","perspective":"平台化与可换模块的差别","analysis":"主板与其他模块可替换，前提是稳定接口与结构包络。平台化还需规划跨代复用、版本和验证策略。","exercise":"为一款设备定义稳定平台、可替换模块和兼容矩阵。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-065","chapter_id":22,"case_id":"HWCASE-PRUSA","question_id":"22.5.1","question_title":"请简要解释什么是硬件产品的平台化与模块化设计，并说明它们如何支持快速定制开发。","question_anchor":"22.5.1 请简要解释什么是硬件产品的平台化与模块化设计，并说明它们如何支持快速定制开发。","perspective":"快速定制靠版本化工艺包","analysis":"可编辑设计便于快速适应，但每次定制都可能改变强度、材料与使用边界。必须保留版本和验证记录。","exercise":"设计一份定制申请，列尺寸变更、材料、验证和旧版隔离。","analysis_kind":"AI教学归纳","learning_status":"未作答"},{"id":"REL-066","chapter_id":22,"case_id":"HWCASE-IKE 时，新信息已经明显趋于饱和；继续把样本扩大十倍，新增洞察可能十分有限。\n\n对企业经理人而言，调研要在准确性、时间和成本之间取得平衡。30个深度样本并不是学术统计的替代品，而是一套用于产品创新和经营决策的实用方法。\n\n> **注意**  \n> “30人”适合深度需求探索；如果要估算市场规模、占有率或比例，仍需要更规范的定量研究。"}],"hw_card":"20-理论/高建华/课程关联卡/GJH-RESEARCH 市场调研的1230法则.md","gao_card":"00-导航/智能硬件关联/GJH-RESEARCH 市场调研的1230法则.md","uri":"obsidian://open?vault=%E9%AB%98%E5%BB%BA%E5%8D%8E%E7%9F%A5%E8%AF%86%E4%BD%93%E7%B3%BB&file=02-%E7%88%86%E5%93%81%E9%82%A3%E7%82%B9%E4%BA%8B%2F02%E8%AF%BE-%E5%B8%82%E5%9C%BA%E8%B0%83%E7%A0%94%E7%9A%841230%E6%B3%95%E5%88%99%EF%BC%88%E4%BC%98%E5%8C%96%E9%98%85%E8%AF%BB%E7%89%88%EF%BC%89","section_uris":[{"heading":"一、什么是1230法则","uri":"obsidian://open?vault=%E9%AB%98%E5%BB%BA%E5%8D%8E%E7%9F%A5%E8%AF%86%E4%BD%93%E7%B3%BB&file=02-%E7%88%86%E5%93%81%E9%82%A3%E7%82%B9%E4%BA%8B%2F02%E8%AF%BE-%E5%B8%82%E5%9C%BA%E8%B0%83%E7%A0%94%E7%9A%841230%E6%B3%95%E5%88%99%EF%BC%88%E4%BC%98%E5%8C%96%E9%98%85%E8%AF%BB%E7%89%88%EF%BC%89%23%E4%B8%80%E3%80%81%E4%BB%80%E4%B9%88%E6%98%AF1230%E6%B3%95%E5%88%99"},{"heading":"四、为什么选择30个深度样本","uri":"obsidian://open?vault=%E9%AB%98%E5%BB%BA%E5%8D%8E%E7%9F%A5%E8%AF%86%E4%BD%93%E7%B3%BB&file=02-%E7%88%86%E5%93%81%E9%82%A3%E7%82%B9%E4%BA%8B%2F02%E8%AF%BE-%E5%B8%82%E5%9C%BA%E8%B0%83%E7%A0%94%E7%9A%841230%E6%B3%95%E5%88%99%EF%BC%88%E4%BC%98%E5%8C%96%E9%98%85%E8%AF%BB%E7%89%88%EF%BC%89%23%E5%9B%9B%E3%80%81%E4%B8%BA%E4%BB%80%E4%B9%88%E9%80%89%E6%8B%A930%E4%B8%AA%E6%B7%B1%E5%BA%A6%E6%A0%B7%E6%9C%AC"}],"summary":"围绕明确的目标市场开展深入的一对一访谈，从真实使用、购买和拒绝原因提出需求假设。","boundary":"阅读版中的30人、两小时与分组属于课程方法表述；不能据此保证统计代表性或直接估算市场比例。","analysis_kind":"基于现有阅读版的AI归纳","export_path":"theory/高建华/02-爆品那点事/02课-市场调研的1230法则（优化阅读版）.md"},{"id":"GJH-NEEDS","key":"NEEDS","path":"05-顶级营销课/17课-学会深度挖掘客户未被满足的实际需求（优化阅读版）.md","title":"学会深度挖掘客户未被满足的实际需求","sha256":"45e47697f8f51d385e2b4468e1a3ff1460208bbbf5615e6f7dc5cdb321740c2b","bytes":2316,"source_level":"现有优化阅读版，未逐句核对原录音或原始Word","read_at":"2026-11-03","sections":[{"h":"三、让多角色参与需求研究","b":"## 三、让多角色参与需求研究\n\n使用者、购买者、决策者和影响者看到的问题并不相同。只听单一角色，容易把局部偏好误当成整体需求。应通过访谈、现场观察和  |\n| 客户层级 | 产品分别服务哪一类客户？高端、中端还是大众市场？ |\n| 产品代际 | 下一代产品相对上一代有什么关键进步？ |\n| 时间节奏 | 每款产品何时验证、开发、上市和退出？ |\n\n因此，路线图不能只写“未来要做A产品、B产品、C产品”，还要写清楚这些产品为什么存在、面向谁，以及彼此如何衔接。"},{"h":"三、老产品升级的五个方向","b":"## 三、老产品升级的五个方向\n\n产品路线图不等于不断增加全新产品。对现有产品进行有目的的升级，同样是路线图的一部分。\n\n| 升级方向 | 典型问题 |\n| --- | --- |\n| 外观 | 造型、尺寸、颜色和界面是否需要更新？ |\n| 工艺 | 是否能提高稳定性、精度和一致性？ |\n| 性能 | 速度、能耗、寿命、容量等指标能否提升？ |\n| 功能 | 哪些新功能能解决明确的客户任务？ |\n| 材料 | 是否能改善质感、安全性、耐用性或成本？ |\n\n升级时要避免“为了变化而变化”。每项改动都应对应具体的客户价值，或者明显降低企业的生产与服务成本。"}],"hw_card":"20-理论/高建华/课程关联卡/GJH-ROADMAP 手把手教你做产品开发路线图.md","gao_card":"00-导航/智能硬件关联/GJH-ROADMAP 手把手教你做产品开发路线图.md","uri":"obsidian://open?vault=%E9%AB%98%E5%BB%BA%E5%8D%8E%E7%9F%A5%E8%AF%86%E4%BD%93%E7%B3%BB&file=02-%E7%88%86%E5%93%81%E9%82%A3%E7%82%B9%E4%BA%8B%2F15%E8%AF%BE-%E6%89%8B%E6%8A%8A%E6%89%8B%E6%95%99%E4%BD%A0%E5%81%9A%E4%BA%A7%E5%93%81%E5%BC%80%E5%8F%91%E8%B7%AF%E7%BA%BF%E5%9B%BE%EF%BC%88%E4%BC%98%E5%8C%96%E9%98%85%E8%AF%BB%E7%89%88%EF%BC%89","section_uris":[{"heading":"一、路线图要回答三个问题","uri":"obsidian://open?vault=%E9%AB%98%E5%BB%BA%E5%8D%8E%E7%9F%A5%E8%AF%86%E4%BD%93%E7%B3%BB&file=02-%E7%88%86%E5%93%81%E9%82%A3%E7%82%B9%E4%BA%8B%2F15%E8%AF%BE-%E6%89%8B%E6%8A%8A%E6%89%8B%E6%95%99%E4%BD%A0%E5%81%9A%E4%BA%A7%E5%93%81%E5%BC%80%E5%8F%91%E8%B7%AF%E7%BA%BF%E5%9B%BE%EF%BC%88%E4%BC%98%E5%8C%96%E9%98%85%E8%AF%BB%E7%89%88%EF%BC%89%23%E4%B8%80%E3%80%81%E8%B7%AF%E7%BA%BF%E5%9B%BE%E8%A6%81%E5%9B%9E%E7%AD%94%E4%B8%89%E4%B8%AA%E9%97%AE%E9%A2%98"},{"heading":"三、老产品升级的五个方向","uri":"obsidian://open?vault=%E9%AB%98%E5%BB%BA%E5%8D%8E%E7%9F%A5%E8%AF%86%E4%BD%93%E7%B3%BB&file=02-%E7%88%86%E5%93%81%E9%82%A3%E7%82%B9%E4%BA%8B%2F15%E8%AF%BE-%E6%89%8B%E6%8A%8A%E6%89%8B%E6%95%99%E4%BD%A0%E5%81%9A%E4%BA%A7%E5%93%81%E5%BC%80%E5%8F%91%E8%B7%AF%E7%BA%BF%E5%9B%BE%EF%BC%88%E4%BC%98%E5%8C%96%E9%98%85%E8%AF%BB%E7%89%88%EF%BC%89%23%E4%B8%89%E3%80%81%E8%80%81%E4%BA%A7%E5%93%81%E5%8D%87%E7%BA%A7%E7%9A%84%E4%BA%94%E4%B8%AA%E6%96%B9%E5%90%91"}],"summary":"路线图同时表达目标客户、产品代际与验证、开发、上市和退出节奏；升级应对应客户价值或生产服务收益。","boundary":"路线图是规划，不是交付事实；长期支持承诺需要后续逐年验证。","analysis_kind":"基于现有阅读版的AI归纳","export_path":"theory/高建华/02-爆品那点事/15课-手把手教你做产品开发路线图（优化阅读版）.md"},{"id":"GJH-PROCESS","key":"PROCESS","path":"02-爆品那点事/06课-通过流程实现跨部门合作（优化阅读版）.md","title":"通过流程实现跨部门合作","sha256":"b340605521c5b7e255bd32a7cc9122409310da5161aa9e9382eb637f5ce21389","bytes":6223,"source_level":"现有优化阅读版，未逐句核对原录音或原始Word","read_at":"2026-11-03","sections":[{"h":"四、流程中为什么必须有“检查站”","b":"## 四、流程中为什么必须有“检查站”\n\n很多企业画出的流程只有一个个执行方框，没有审核与退出机制。这类流程只能说明做事顺序，无法控制质量和风险。\n\n检查站应回答标准化问题，并产生明确结果：\n\n- **通过：** 进入下一阶段；\n- **补考：** 补充证据、修改方案后再次评审；\n- **终止：** 需求不强、价值不足或偏离战略，停止投入。\n\n### 典型检查内容\n\n| 阶段 | 检查重点 |\n|---|---|\n| 立项后 | 是否符合企业战略和产品线规划 |\n| 概念后 | 客户问题是否重要、紧迫，概念能否引发共鸣 |\n| 定义后 | 市场规模、竞争、成本、上市时间和技术条件是否清晰 |\n\n越早否决错误项目，损失越小。一个“有需求但不够强烈”的锦上添花项目，应在概念阶段停止，而不是等研发完成后再由市场证明失败。"},{"h":"七、流程设计与执行的责任","b":"## 七、流程设计与执行的责任\n\n### 7.1 自上而下推动\n\n流程管理是一把手工程。高层如果绕过流程、随意特批，其他部门就不会认真执行。\n\n### 7.2 由最懂业务的人设计\n\n本部门流程可由经验丰富的部门负责人、项目负责人或优秀员工主导。流程不是行政人员凭空编写，而是对最佳实践的总结。\n\n### 7.3 跨部门流程共同设计\n\n涉及多个部门时，应把所有“握手关系”的负责人召集在一起，共同讨论输入、输出、时限、标准和责任，达成共识后再固化。\n\n### 7.4 定期监督和复盘\n\n没有检查，流程容易变成形式。企业需要定期审查流程是否被遵守、哪里出现等待、哪些标准已经不适用，并持续改进。"}],"hw_card":"20-理论/高建华/课程关联卡/GJH-PROCESS 通过流程实现跨部门合作.md","gao_card":"00-导航/智能硬件关联/GJH-PROCESS 通过流程实现跨部门合作.md","uri":"obsidian://open?vault=%E9%AB%98%E5%BB%BA%E5%8D%8E%E7%9F%A5%E8%AF%86%E4%BD%93%E7%B3%BB&file=02-%E7%88%86%E5%93%81%E9%82%A3%E7%82%B9%E4%BA%8B%2F06%E8%AF%BE-%E9%80%9A%E8%BF%87%E6%B5%81%E7%A8%8B%E5%AE%9E%E7%8E%B0%E8%B7%A8%E9%83%A8%E9%97%A8%E5%90%88%E4%BD%9C%EF%BC%88%E4%BC%98%E5%8C%96%E9%98%85%E8%AF%BB%E7%89%88%EF%BC%89","section_uris":[{"heading":"四、流程中为什么必须有“检查站”","uri":"obsidian://open?vault=%E9%AB%98%E5%BB%BA%E5%8D%8E%E7%9F%A5%E8%AF%86%E4%BD%93%E7%B3%BB&file=02-%E7%88%86%E5%93%81%E9%82%A3%E7%82%B9%E4%BA%8B%2F06%E8%AF%BE-%E9%80%9A%E8%BF%87%E6%B5%81%E7%A8%8B%E5%AE%9E%E7%8E%B0%E8%B7%A8%E9%83%A8%E9%97%A8%E5%90%88%E4%BD%9C%EF%BC%88%E4%BC%98%E5%8C%96%E9%98%85%E8%AF%BB%E7%89%88%EF%BC%89%23%E5%9B%9B%E3%80%81%E6%B5%81%E7%A8%8B%E4%B8%AD%E4%B8%BA%E4%BB%80%E4%B9%88%E5%BF%85%E9%A1%BB%E6%9C%89%E2%80%9C%E6%A3%80%E6%9F%A5%E7%AB%99%E2%80%9D"},{"heading":"七、流程设计与执行的责任","uri":"obsidian://open?vault=%E9%AB%98%E5%BB%BA%E5%8D%8E%E7%9F%A5%E8%AF%86%E4%BD%93%E7%B3%BB&file=02-%E7%88%86%E5%93%81%E9%82%A3%E7%82%B9%E4%BA%8B%2F06%E8%AF%BE-%E9%80%9A%E8%BF%87%E6%B5%81%E7%A8%8B%E5%AE%9E%E7%8E%B0%E8%B7%A8%E9%83%A8%E9%97%A8%E5%90%88%E4%BD%9C%EF%BC%88%E4%BC%98%E5%8C%96%E9%98%85%E8%AF%BB%E7%89%88%EF%BC%89%23%E4%B8%83%E3%80%81%E6%B5%81%E7%A8%8B%E8%AE%BE%E8%AE%A1%E4%B8%8E%E6%89%A7%E8%A1%8C%E7%9A%84%E8%B4%A3%E4%BB%BB"}],"summary":"跨部门流程需要明确握手接口与责任，检查站允许通过、补证重审或终止，并定期复盘。","boundary":"课程的经营检查站不能直接等同EVT/DVT/PVT或法定审核；技术门槛仍由专业证据决定。","analysis_kind":"基于现有阅读版的AI归纳","export_path":"theory/高建华/02-爆品那点事/06课-通过流程实现跨部门合作（优化阅读版）.md"},{"id":"GJH-PRICE","key":"PRICE","path":"02-爆品那点事/11课-定价，绝不只是一个数字那么简单（优化阅读版）.md","title":"定价，绝不只是一个数字那么简单","sha256":"8e8bdefd19774c7f371ef498b8071d4fc9b47c9dd38315572396e54a33f37277","bytes":5743,"source_level":"现有优化阅读版，未逐句核对原录音或原始Word","read_at":"2026-11-03","sections":[{"h":"一、四种基本定价逻辑","b":"## 一、四种基本定价逻辑\n\n| 定价方式 | 产品与价格关系 | 主要目标客户 | 竞争方式 |\n|---|---|---|---|\n| 优质优价 | 品质更好，价格也更高 | 中产及以上客户 | 用独特价值支撑溢价 |\n| 优质同价 | 价格相近，品质更好 | 大众市场中偏重品质者 | 用更高性价比替代普通产品 |\n| 同质低价 | 品质接近，价格更低 | 高度价格敏感客户 | 依靠规模和成本效率 |\n| 低质低价 | 降低品质和配置以压低价格 | 预算极其有限的客户 | 满足最低基本需求 |\n\n企业如果拥有多个系列，可以分别服务不同人群；但每个系列的客户、品质、价格和传播必须一致，不能一款产品同时满足所有人。"},{"h":"五、产品组合中的四种角色","b":"## 五、产品组合中的四种角色\n\n| 产品角色 | 主要任务 | 价格与利润特点 |\n|---|---|---|\n| 引流产品 | 降低首次接触门槛，让客户愿意体验 | 免费、补贴或低利润，不宜盲目扩大销量 |\n| 走量产品 | 建立客户规模和市场覆盖 | 价格有竞争力，利润较薄 |\n| 利润产品 | 为企业贡献主要利润 | 差异化明显，适合优质优价 |\n| 形象产品 | 展示最高能力，抢占行业制高点 | 价格高、销量少，主要提升品牌与认知 |\n\n销售展示通常应“从上往下引”：先用形象产品建立高度，再根据客户预算引导到利润产品或走量产品。如果一开始只展示最低价产品，后续很难向上升级。"}],"hw_card":"20-理论/高建华/课程关联卡/GJH-PRICE 定价，绝不只是一个数字那么简单.md","gao_card":"00-导航/智能硬件关联/GJH-PRICE 定价，绝不只是一个数字那么简单.md","uri":"obsidian://open?vault=%E9%AB%98%E5%BB%BA%E5%8D%8E%E7%9F%A5%E8%AF%86%E4%BD%93%E7%B3%BB&file=02-%E7%88%86%E5%93%81%E9%82%A3%E7%82%B9%E4%BA%8B%2F11%E8%AF%BE-%E5%AE%9A%E4%BB%B7%E  客户是否理解产品概念？\n- 方案是否与客户现有习惯相符？\n- 哪项价值最能打动客户？\n- 客户是否愿意进一步了解或尝试？\n\n概念测试不需要做出完整产品。文字说明、示意图、场景图或简易模型，都可以帮助客户理解并表达意见。\n\n### 2. 开发中：让客户评价原型\n\n产品进入原型或样机阶段后，可以组织焦点小组，让客户在相对中立的环境中体验和讨论。\n\n为了减少品牌光环和人情因素的干扰，测试时可以暂时弱化品牌信息，让客户首先评价产品本身：\n\n- 是否容易理解和使用；\n- 哪些功能真正有价值；\n- 哪些设计令人困惑；\n- 与现有替代方案相比，优势是否明显；\n- 是否存在不能接受的缺陷。\n\n### 3. 开发后：小批量试用再量产\n\n样品通过内部测试，并不代表已经适合大规模上市。真实用户、真实环境和持续使用，常常会暴露实验室里看不到的问题。\n\n因此，在正式量产前，应安排小批量试用，并建立反馈闭环：记录问题、判断严重程度、确定责任人、完成修正，再决定是否扩大生产。"},{"h":"四、设计一条完整的客户参与链路","b":"## 四、设计一条完整的客户参与链路\n\n企业可以在产品开发过程中设置五个客户接触点。\n\n| 接触点 | 客户参与内容 | 企业应获得的输出 |\n| --- | --- | --- |\n| 需求与创意阶段 | 描述场景、痛点和未满足需求 | 需求清单与机会排序 |\n| 概念阶段 | 评价多个产品概念 | 概念接受度与优化方向 |\n| 产品定义阶段 | 讨论功能、体验、价格和取舍 | 清晰的产品定义 |\n| 原型与样品阶段 | 试用、比较、提出问题 | 缺陷清单与改进优先级 |\n| 小批量试用阶段 | 在真实场景中持续使用 | 上市前验证结论 |\n\n这条链路的关键，不是开多少次会，而是每次参与都要有明确的问题、记录和后续动作。"}],"hw_card":"20-理论/高建华/课程关联卡/GJH-COCREATE 拒绝闭门造车：让客户参与进来.md","gao_card":"00-导航/智能硬件关联/GJH-COCREATE 拒绝闭门造车：让客户参与进来.md","uri":"obsidian://open?vault=%E9%AB%98%E5%BB%BA%E5%8D%8E%E7%9F%A5%E8%AF%86%E4%BD%93%E7%B3%BB&file=02-%E7%88%86%E5%93%81%E9%82%A3%E7%82%B9%E4%BA%8B%2F14%E8%AF%BE-%E6%8B%92%E7%BB%9D%E9%97%AD%E9%97%A8%E9%80%A0%E8%BD%A6%EF%BC%9A%E8%AE%A9%E5%AE%A2%E6%88%B7%E5%8F%82%E4%B8%8E%E8%BF%9B%E6%9D%A5%EF%BC%88%E4%BC%98%E5%8C%96%E9%98%85%E8%AF%BB%E7%89%88%EF%BC%89","section_uris":[{"heading":"一、客户参与开发的三个阶段","uri":"obsidian://open?vault=%E9%AB%98%E5%BB%BA%E5%8D%8E%E7%9F%A5%E8%AF%86%E4%BD%93%E7%B3%BB&file=02-%E7%88%86%E5%93%81%E9%82%A3%E7%82%B9%E4%BA%8B%2F14%E8%AF%BE-%E6%8B%92%E7%BB%9D%E9%97%AD%E9%97%A8%E9%80%A0%E8%BD%A6%EF%BC%9A%E8%AE%A9%E5%AE%A2%E6%88%B7%E5%8F%82%E4%B8%8E%E8%BF%9B%E6%9D%A5%EF%BC%88%E4%BC%98%E5%8C%96%E9%98%85%E8%AF%BB%E7%89%88%EF%BC%89%23%E4%B8%80%E3%80%81%E5%AE%A2%E6%88%B7%E5%8F%82%E4%B8%8E%E5%BC%80%E5%8F%91%E7%9A%84%E4%B8%89%E4%B8%AA%E9%98%B6%E6%AE%B5"},{"heading":"四、设计一条完整的客户参与链路","uri":"obsidian://open?vault=%E9%AB%98%E5%BB%BA%E5%8D%8E%E7%9F%A5%E8%AF%86%E4%BD%93%E7%B3%BB&file=02-%E7%88%86%E5%93%81%E9%82%A3%E7%82%B9%E4%BA%8B%2F14%E8%AF%BE-%E6%8B%92%E7%BB%9D%E9%97%AD%E9%97%A8%E9%80%A0%E8%BD%A6%EF%BC%9A%E8%AE%A9%E5%AE%A2%E6%88%B7%E5%8F%82%E4%B8%8E%E8%BF%9B%E6%9D%A5%EF%BC%88%E4%BC%98%E5%8C%96%E9%98%85%E8%AF%BB%E7%89%88%EF%BC%89%23%E5%9B%9B%E3%80%81%E8%AE%BE%E8%AE%A1%E4%B8%80%E6%9D%A1%E5%AE%8C%E6%95%B4%E7%9A%84%E5%AE%A2%E6%88%B7%E5%8F%82%E4%B8%8E%E9%93%BE%E8%B7%AF"}],"summary":"在概念、原型、小批量真实使用等阶段让目标客户参与，并建立反馈、修改与复测链路。","boundary":"核心用户可能有自选偏差；共创不能把产品责任转移给客户，也不能让用户承担未经控制的危险测试。","analysis_kind":"基于现有阅读版的AI归纳","export_path":"theory/高建华/02-爆品那点事/14课-拒绝闭门造车：让客户参与进来（优化阅读版）.md"},{"id":"GJH-LAUNCH","key":"LAUNCH","path":"02-爆品那点事/16课-做好准备工作才能持续引爆市场（优化阅读版）.md","title":"做好准备工作，才能持续引爆市场","sha256":"e12fd5be999aaa3596ee3ca5f3c58fb0c5adb32f3bc63147a751e7679ad9071c","bytes":6745,"source_level":"现有优化阅读版，未逐句核对原录音或原始Word","read_at":"2026-11-03","sections":[{"h":"二、启动市场的四个内部条件","b":"## 二、启动市场的四个内部条件\n\n在市场推广前，应检查以下基础是否具备。\n\n| 条件 | 具体含义 |\n| --- | --- |\n| 信任领导者 | 团队相信方向和承诺，不因短期困难轻易动摇 |\n| 热爱产品 | 员工理解产品价值，愿意主动体验和推荐 |\n| 认同销售模式 | 团队理解获客、成交、服务和复购的基本逻辑 |\n| 具备执行机制 | 目标、责任、节奏、反馈和激励能够形成闭环 |\n\n这四项并不华丽，却直接影响产品上市后的执行质量。"},{"h":"六、按照“1—3—10—30”逐步复制","b":"## 六、按照“1—3—10—30”逐步复制\n\n课程提出“1—3—10—30”的市场扩张思路：\n\n- **1个样板市场：** 找到初步有效的方法；\n- **3个差异化市场：** 在不同区域或不同条件下复测；\n- **10个市场：** 验证组织与支持体系能否跟上；\n- **30个市场：** 在方法稳定后扩大覆盖。\n\n其中，从1到3最关键。企业可以选择条件差异较大的区域，例如不同经济水平、消费习惯或渠道结构的市场，判断方法究竟是普遍有效，还是只在一个特殊环境中成立。"}],"hw_card":"20-理论/高建华/课程关联卡/GJH-LAUNCH 做好准备工作，才能持续引爆市场.md","gao_card":"00-导航/智能硬件关联/GJH-LAUNCH 做好准备工作，才能持续引爆市场.md","uri":"obsidian://open?vault=%E9%AB%98%E5%BB%BA%E5%8D%8E%E7%9F%A5%E8%AF%86%E4%BD%93%E7%B3%BB&file=02-%E7%88%86%E5%93%81%E9%82%A3%E7%82%B9%E4%BA%8B%2F16%E8%AF%BE-%E5%81%9A%E5%A5%BD%E5%87%86%E5%A4%87%E5%B7%A5%E4%BD%9C%E6%89%8D%E8%83%BD%E6%8C%81%E7%BB%AD%E5%BC%95%E7%88%86%E5%B8%82%E5%9C%BA%EF%BC%88%E4%BC%98%E5%8C%96%E9%98%85%E8%AF%BB%E7%89%88%EF%BC%89","section_uris":[{"heading":"二、启动市场的四个内部条件","uri":"obsidian://open?vault=%E9%AB%98%E5%BB%BA%E5%8D%8E%E7%9F%A5%E8%AF%86%E4%BD%93%E7%B3%BB&file=02-%E7%88%86%E5%93%81%E9%82%A3%E7%82%B9%E4%BA%8B%2F1 BC%9A%E5%88%B6%E4%BD%9C%E5%BA%94%E7%94%A8%E6%8C%87%E5%8D%97%E5%92%8C%E5%AE%A2%E6%88%B7%E6%A1%88%E4%BE%8B%EF%BC%88%E4%BC%98%E5%8C%96%E9%98%85%E8%AF%BB%E7%89%88%EF%BC%89%23%E4%B8%89%E3%80%81%E8%AE%A9%E4%B8%80%E7%BA%BF%E8%83%BD%E5%BF%AB%E9%80%9F%E8%B0%83%E7%94%A8"}],"summary":"客户案例整理背景、挑战、方案、实施、效果和可复用启示，再按行业、场景与角色便于调用。","boundary":"召回或失败复盘应如实呈现风险与未知，不能为了套用成功案例结构而补造效果或客户证言。","analysis_kind":"基于现有阅读版的AI归纳","export_path":"theory/高建华/05-顶级营销课/31课-学会制作应用指南和客户案例（优化阅读版）.md"},{"id":"GJH-CONCEPTSCENE","key":"CONCEPTSCENE","path":"02-爆品那点事/08课-避免自嗨：做有效的概念测试（优化阅读版）.md","title":"避免自嗨：做有效的概念测试","sha256":"b8a9d100de8fff4cb347a3569c9960ffbf09493af621a86601a8c567c7759a47","bytes":5533,"source_level":"现有优化阅读版，未逐句核对原录音或原始Word","read_at":"2026-11-03","sections":[{"h":"三、概念测试的标准流程","b":"## 三、概念测试的标准流程\n\n### 第一步：准备测试材料\n\n把每个价值点制作成一张独立图片，使用客户听得懂的语言，展示问题、场景和改善结果。\n\n### 第二步：招募30名目标客户\n\n分成三组，每组10人。受访者要符合目标客户条件，并签署必要的保密协议。企业应提供现金或礼品，尊重对方付出的时间。\n\n### 第三步：快速浏览\n\n让客户在约5分钟内看完全部概念，不逐张进行详细讲解，避免工作人员影响判断。\n\n### 第四步：离开材料后回忆\n\n把客户带到另一处，一对一询问：“你刚才看到了什么？”\n\n离开图片后仍能被记住的内容，通常是最有冲击力或最符合需求的概念。\n\n### 第五步：记录并合并同类项\n\n统计每个概念被主动提及的次数，记录客户的原话、理由和顾虑，再形成优先级排序。\n\n```text\n文字概念 → 场景图片 → 目标客户快速浏览 → 自由回忆 → 频次排序 → 深度追问\n```"},{"h":"五、把测试结果转化为产品设计","b":"## 五、把测试结果转化为产品设计\n\n概念测试不能停留在排名，还要转化为空间、功能和资源配置：\n\n- 食堂需要多大面积、提供哪些半成品和成品；\n- 儿童照看空间需要几个房间、服务多大年龄段；\n- 接送路线覆盖哪些学校、如何收费；\n- 哪些低排名概念应取消或缩减；\n- 哪些价值应成为销售传播重点。\n\n概念越具体，后续产品定义越容易量化。"}],"hw_card":"20-理论/高建华/课程关联卡/GJH-CONCEPTSCENE 避免自嗨：做有效的概念测试.md","gao_card":"00-导航/智能硬件关联/GJH-CONCEPTSCENE 避免自嗨：做有效的概念测试.md","uri":"obsidian://open?vault=%E9%AB%98%E5%BB%BA%E5%8D%8E%E7%9F%A5%E8%AF%86%E4%BD%93%E7%B3%BB&file=02-%E7%88%86%E5%93%81%E9%82%A3%E7%82%B9%E4%BA%8B%2F08%E8%AF%BE-%E9%81%BF%E5%85%8D%E8%87%AA%E5%97%A8%EF%BC%9A%E5%81%9A%E6%9C%89%E6%95%88%E7%9A%84%E6%A6%82%E5%BF%B5%E6%B5%8B%E8%AF%95%EF%BC%88%E4%BC%98%E5%8C%96%E9%98%85%E8%AF%BB%E7%89%88%EF%BC%89","section_uris":[{"heading":"三、概念测试的标准流程","uri":"obsidian://open?vault=%E9%AB%98%E5%BB%BA%E5%8D%8E%E7%9F%A5%E8%AF%86%E4%BD%93%E <script id="xdata" type="application/json">{"meta":{"read_at":"2026-11-09","schema":"x-1.0"},"sources":[{"id":"XS-01","title":"Introducing Alexa+, the next generation of Alexa - About Amazon","url":"https://www.aboutamazon.com/news/devices/new-alexa-generative-artificial-intelligence","type":"manufacturer"},{"id":"XS-02","title":"Amazon's new Echo devices built for Alexa+ - About Amazon","url":"https://www.aboutamazon.com/news/devices/amazon-new-echo-devices-alexa-plus","type":"manufacturer"},{"id":"XS-03","title":"Gemini for Home: Your household's new, more helpful assistant - Google","url":"https://blog.google/products-and-platforms/devices/google-nest/gemini-for-home/","type":"manufacturer"},{"id":"XS-04","title":"Meet the new Google Home Speaker, built for Gemini - Google","url":"https://blog.google/products-and-platforms/devices/google-nest/google-home-speaker-gemini-features/","type":"manufacturer"},{"id":"XS-05","title":"Voice Chapter 8 - Assist in the home today - Home Assistant","url":"https://home-assistant.io/blog/2024/12/19/voice-chapter-8-assist-in-the-home","type":"project"},{"id":"XS-06","title":"Matter 1.5 Introduces Cameras, Closures and Enhanced Energy Management - CSA","url":"https://csa-iot.org/newsroom/matter-1-5-introduces-cameras-closures-and-enhanced-energy-management-capabilities/","type":"standards"},{"id":"XS-07","title":"小智 AI 聊天机器人 - 乐鑫 ESP-IoT-Solution 文档","url":"https://docs.espressif.com/projects/esp-iot-solution/zh_CN/latest/ai/xiaozhi.html","type":"manufacturer"},{"id":"XS-08","title":"ESP-SR 语音识别组件 - 乐鑫组件库","url":"https://components.espressif.com/components/espressif/esp-sr","type":"manufacturer"},{"id":"XS-09","title":"空中升级 (OTA) - ESP-IDF 编程指南","url":"https://docs.espressif.com/projects/esp-idf/zh-cn/stable/api-reference/system/ota.html","type":"manufacturer"},{"id":"XS-10","title":"SwitchBot launches its AI-centric Matter home hub - HomeKit News","url":"https://homekitnews.com/2026/01/22/switchbot-launches-its-ai-centric-matter-home-hub/","type":"media"},{"id":"XS-11","title":"EU Cyber Resilience Act: 24-hour reporting duties start September 11, 2026 - Jones Day","url":"https://www.jonesday.com/de/insights/2026/07/eu-cyber-resilience-act-24hour-reporting-duties-start-september-11-2026","type":"law"},{"id":"XS-12","title":"White House Launches U.S. Cyber Trust Mark (2025-01-07)","url":"https://bidenwhitehouse.archives.gov/briefing-room/statements-releases/2025/01/07/white-house-launches-u-s-cyber-trust-mark-providing-american-consumers-an-easy-label-to-see-if-connected-devices-are-cybersecure","type":"regulator"},{"id":"XS-13","title":"《生成式人工智能服务管理暂行办法》发布 - 国家网信办","url":"https://www.cac.gov.cn/2023-07/13/c_1690898326795531.htm","type":"regulator"}],"cases":[{"id":"XC-ALEXA","title":"Alexa+：大模型助手编排家庭服务","date":"2025-02-26","src":["XS-01"],"topics":["XT-AGENT","XT-COST"],"facts":"Amazon称Alexa+由Amazon Bedrock上的大模型驱动，用“experts”（一组系统、能力、API与指令）编排数以万计的服务和设备；售价每月19.99美元，Prime会员免费；可控制Philips Hue、Roborock等智能家居，并用语音创建自定义Routine；交互与设置集中在Alexa隐私面板。官方页面（2026-07更新）称已向美国和加拿大全部用户开放。","lesson":"“experts”本质是把设备与服务能力整理成模型可调用的工具集合。对硬件PM而言，产品定义的重点从“支持哪些语音指令”转向“开放哪些可被安全调用的能力”。会员捆绑说明AI成本可以由生态收入覆盖，小厂需另找成本承担方。","limits":"页面未说明具体模型、端云分工与延迟数据；“Prime免费”是商业安排，不代表单用户推理成本低。"},{"id":"XC-ECHO25","title":"Echo 2025新品：为大模型重做音频前端与边缘算力","date":"2025-09-30","src":["XS-02"],"topics":["XT-VOICE","XT-EDGE","XT-SENSE"],"facts":"Amazon发布Echo Dot Max（99.99美元）、Echo Studio（219.99美元）、Echo Show 8（179.99美元）、Echo Show 11（219.99美元）。自研AZ3与AZ3 Pro芯片带AI加速器：AZ3称唤醒词检测提升50%以上；AZ3 Pro增加对语言模型和视觉Transformer的支持。Omnisense平台融合13MP摄像头、音频、超声波、Wi-Fi雷达、加速度计和Wi-Fi CSI，用于识别特定人后触发Routine、或提醒晚上10点后车库门未锁。","lesson":"软件助手换代（Alexa+）倒逼硬件换代：麦克风阵列与音频前端决定“能不能听清”，边缘加速器决定“能不能快、能不能离线”。多传感器融合让设备从被动应答走向主动服务。","limits":"页面未说明哪些任务在端侧运行；该页未描述Omnisense传感数据的隐私保护措施。“提升50%以上”为厂商宣称，未独立复现。"},{"id":"XC-GEMINI","title":"Gemini for Home与Google Home Speaker：存量升级+新硬件","date":"2025-08-20 / 2026-06-17","src":["XS-03","XS-04"],"topics":["XT-AGENT","XT-PRIV","XT-COST"],"facts":"Google称Gemini for Home将逐步替代Google Assistant，覆盖现有音箱和屏幕，分免费与付费版；可一次处理多条指令和复杂请求（如“关掉除卧室外所有的灯”）；Gemini Live支持连续对话和打断。2026-06-17发布的Google Home Speaker售价99.99美元、6月25日上架，具备环境自适应的麦克风处理、显示聆听/思考/回应状态的灯环和麦克风静音拨杆；Gemini Live属于付费订阅Google Home Premium；可与Google TV Streamer组成环绕声。","lesson":"两条路线并行：存量设备靠软件升级保住装机量，新硬件承载更好的收音与体验。灯环状态+物理静音是AI常时聆听设备的“信任设计”，应写进PRD的必备需求。","limits":"页面未提及专用AI处理器，未给订阅价格；“替代Assistant”是计划描述，不是完成情况。"},{"id":"XC-HAVPE","title":"Home Assistant Voice PE：隐私优先的本地语音路线","date":"2024-12-19","src":["XS-05"],"topics":["XT-VOICE","XT-EDGE","XT-PRIV"],"facts":"Home Assistant发布Voice Preview Edition：用microWakeWord在设备端唤醒（默认“Okay Nabu”）；可本地运行Whisper语音识别与Piper语音合成（30多种语言），或用Home Assistant Cloud（官方称最准确、最省电）；可选接入ChatGPT、Gemini、Claude或本地Ollama模型；官方称Cloud不存储、不用语音训练；用户自行选择哪些设备暴露给语音。官方也承认本地语音识别算力需求高，约15种语言能在Intel N100级硬件上较好运行。","lesson":"“完全本地”不是免费午餐：唤醒放端侧容易，识别与大模型放本地需要家庭服务器算力。产品上应把“本地/云端/混合”做成用户可选项，并明确每种的准确率、耗电与隐私差异。","limits":"开源社区产品，体验与销量没有第三方数据；“最准确”为官方表述。"},{"id":"XC-SWBOT","title":"SwitchBot AI Hub：端侧视觉语言模型做家庭中枢","date":"2026-01-22（报道）","src":["XS-10"],"topics":["XT-EDGE","XT-SENSE","XT-MATTER","XT-COST"],"facts":"据HomeKit News报道：SwitchBot AI Hub售价259.99美元，使用端侧视觉语言模型（VLM）分析画面并触发自动化；可接入SwitchBot摄像头、门铃和RTSP视频源（报道称至多8路2K）；内置Home Assistant Core容器；作为Matter桥接到Apple Home、Google Home、Alexa、SmartThings和Home Assistant；本地32GB存储，可经USB-C扩展到1TB；部分高级AI功能试用后需订阅；摄像头功能需等Hub与Apple Home都支持Matter 1.5才能接入Apple Home。","lesson":"视觉理解从云端搬到家里的中枢，带来隐私与断网可用的卖点；“硬件+订阅”的混合收费成为常态。中枢产品的竞争点是兼容性（Matter桥接、HA）而不只是AI。","limits":"来源为行业媒体报道，未披露算力（TOPS）与模型规模；本地模型效果未经独立评测。"},{"id":"XC-XIAOZHI","title":"乐鑫“小智”：低成本大模型语音硬件参考路线","date":"文档读取 2026-11-09","src":["XS-07","XS-08"],"topics":["XT-VOICE","XT-AGENT"],"facts":"乐鑫文档把小智描述为双向流式对话组件，连接xiaozhi.me服务，与大模型AI代理进行实时语音或文本交互；页面列出ESP32-S3；通信协议为WebSocket与MQTT+UDP，音频格式OPUS、G.711、PCM；通过MCP控制扬声器、LED、舵机、GPIO等；流程为流式ASR→LLM→TTS；文档提到Qwen、DeepSeek等模型；离线唤醒词由应用层集成ESP-SR。ESP-SR组件提供AFE（回声消除、降噪、盲源分离、VAD）、WakeNet唤醒和MultiNet离线命令词（最多300条中英文命令）。","lesson":"国内AI语音硬件可以“MCU+云端大模型”起步：端侧只做收音、唤醒和离线命令兜底，复杂理解交给云端。MCP让“设备能力”变成模型可调用的工具，是做AI家居单品最快的验证路线。","limits":"文档未说明开源协议；体验依赖云端服务，延迟与费用需自测；不同芯片支持的模块不同（如MultiNet不支持ESP32）。"},{"id":"XC-MATTER15","title":"Matter 1.5：摄像头、窗帘门与能源进入标准","date":"2025-11-20","src":["XS-06"],"topics":["XT-MATTER","XT-SENSE"],"facts":"CSA发布Matter 1.5：摄像头通过WebRTC传输音视频并支持双向对讲，本地与远程访问使用STUN/TURN；覆盖多码流、云台、侦测区与隐私区、本地或云端的连续/事件录像；统一的Closures模型覆盖窗帘、遮阳篷、大门和车库门；新增电价设备类型，EV充电状态和双向充电可认证。规范、SDK与测试工具向联盟成员开放，可用于实施和认证。","lesson":"摄像头进入标准后，AI中枢可以跨品牌拿到视频与事件，“隐私区”成为标准字段。做AI家居硬件应优先规划Matter认证路径，减少自建App与私有协议的负担。","limits":"标准发布不等于认证产品已大量上市；规范细节需联盟成员权限查看。"}],"topics":[{"id":"XT-VOICE","title":"端到端语音链路：唤醒→前端→识别→理解→执行→合成","chapters":[16,18,6],"summary":"AI家居体验的第一道门槛是“听得清、叫得醒、回得快”。链路上每一环都有独立指标，PRD要逐环定义。","facts":[{"t":"乐鑫ESP-SR提供音频前端（回声消除、降噪、盲源分离、VAD）、WakeNet唤醒和MultiNet离线命令词，最多300条中英文命令，可在不重新训练的情况下新增命令。","src":["XS-08"]},{"t":"乐鑫小智采用流式ASR→LLM→TTS链路，音频用OPUS等格式经WebSocket或MQTT+UDP传输。","src":["XS-07"]},{"t":"Home Assistant Voice PE把唤醒放在设备端，识别与合成可选本地Whisper/Piper或云端服务。","src":["XS-05"]},{"t":"Amazon称AZ3芯片使唤醒词检测提升50%以上，并改进对话检测和麦克风阵列（厂商宣称）。","src":["XS-02"]}],"ai":"- **分段定义指标**：唤醒（唤醒率、每24小时误唤醒次数）、前端（远场距离、回声下的识别率）、识别（字错率）、理解（意图准确率）、执行（设备成功率）、合成（自然度）、**端到端时延**（说完到开始回应）。\n- **离线兜底**：开关灯、调音量等高频指令用离线命令词实现，断网也能用；开放问答走云端大模型。\n- **全双工与打断**：大模型助手普遍支持连续对话和打断，需要回声消除质量过关，否则设备会“听到自己说话”。\n- **测试必须在真实家庭声学环境**：电视声、厨房噪声、儿童与老人口音，分别建测试集。","metrics":"| 环节 | 指标 | 测量方法 | 目标值来源 |\n|---|---|---|---|\n| 唤醒 | 唤醒率 / 误唤醒次数(24h) | 不同距离、角度、噪声下录音回放 | 竞品实测 + 用户访谈容忍度 |\n| 前端 | 播放音乐时的唤醒率 | 设备自身外放下测试 | 竞品实测 |\n| 识别 | 字错率 | 标注测试集，分口音/年龄 | 云服务商报告需复测 |\n| 理解 | 意图与槽位准确率 | 家居指令测试集 | 内部基线 |\n| 端到端 | 首字响应时延 | 高速录像或日志打点 | 竞品实测 |","limits":"本页指标表是方法模板，不含行业标准数值；厂商宣称的提升比例未经独立测试。","qids":["10.4.4","16.1.1","16.5.4","18.2.3"],"qweak":true,"old_cases":["HWCASE-ECHO"]},{"id":"XT-EDGE","title":"端云协同：什么放端侧，什么放云端","chapters":[18,16,2],"summary":"端云分工决定成本、时延、隐私和断网体验，是AI硬件架构评审的第一张图。","facts":[{"t":"Home Assistant官方说明本地语音识别算力需求高，约15种语言可在Intel N100级硬件上较好运行；Cloud方案被官方称为最准确、最省电。","src":["XS-05"]},{"t":"Amazon AZ3 Pro支持语言模型和视觉Transformer，用于运行未来的边缘AI模型；页面未说明哪些任务在端侧。","src":["XS-02"]},{"t":"据报道SwitchBot AI Hub用端侧视觉语言模型分析画面，自动化规则可在无网络时运行。","src":["XS-10"]}],"ai":"| 判断维度 | 倾向端侧 | 倾向云端 |\n|---|---|---|\n| 时延要求 | 唤醒、开关灯等毫秒级响应 | 开放问答可容忍1秒以上 |\n| 隐私 | 视频画面、室内声音原始数据 | 已脱敏的文本、事件 |\n| 断网 | 安防、门锁、基础控制必须可用 | 内容、知识问答 |\n| 成本 | 一次性BOM成本（NPU、内存） | 持续API费用 |\n| 迭代 | 模型更新受存储和OTA限制 | 云端随时更新 |\n\n- **常见组合**：端侧做唤醒、离线命令、事件检测（人形、异响），云端做大模型理解与生成；视频只上传事件片段或文字描述。\n- **评审时必须回答**：断网时哪些功能可用？用户可否关闭上云？云服务停运后设备还剩什么（参考Nest Secure案例）。","metrics":"","limits":"分工表为教学归纳；具体取舍需以芯片算力、模型规模和实测时延为准。","qids":["18.6.5","18.7.4","13.5.6","16.1.3","16.3.4","16.3.5"],"qweak":false,"old_cases":["HWCASE-PIAI","HWCASE-QUALCOMM"]},{"id":"XT-AGENT","title":"大模型与Agent控制家居：从“指令”到“工具调用”","chapters":[16,18,3],"summary":"大模型让用户可以说复杂、模糊的话；硬件PM要定义模型能调用哪些设备能力，以及哪些操作必须二次确认。","facts":[{"t":"Alexa+用“experts”编排数以万计的服务和设备，可用语音创建自定义Routine。","src":["XS-01"]},{"t":"Gemini for Home可在一次请求中处理多条指令，如“关掉除卧室外所有的灯”。","src":["XS-03"]},{"t":"乐鑫小智通过MCP控制扬声器、LED、舵机和GPIO等设备能力。","src":["XS-07"]}],"ai":"- **能力清单（Tool list）是新的PRD章节**：每项能力写清名称、参数、取值范围、前置条件、是否高风险。\n- **风险分级**：\n  - 低风险（灯、音乐、窗帘）：直接执行。\n  - 中风险（空调温度、扫地机出门）：执行后播报结果。\n  - 高风险（门锁开启、布防撤防、燃气阀）：必须二次确认，必要时声纹/手机确认，**禁止仅凭模型判断执行**。\n- **失败处理**：设备离线、指令含糊、多设备同名时的追问话术。\n- **评测**：建立家居意图测试集（含方言、口语、多指令），追踪工具调用准确率与“误执行”率。\n- **提示词注入风险**：模型读取的外部内容（日历、网页、消息）中可能夹带指令，高风险操作不能由外部内容触发。","metrics":"| 能力ID | 名称 | 参数 | 风险等级 | 确认方式 | 离线可用 |\n|---|---|---|---|---|---|\n| light.set | 开关/调光 | room, brightness 0–100 | 低 | 无 | 是（离线命令词） |\n| lock.unlock | 开锁 | door_id | 高 | 手机确认 | 否 |\n| （示例行，按项目替换） |  |  |  |  |  |","limits":"风险分级为教学建议，不是标准条款；涉及门锁、安防的产品还需遵守对应产品安全标准。","qids":["1.2.5","18.6.2"],"qweak":true,"old_cases":["HWCASE-HUMANE"]},{"id":"XT-MEMORY","title":"家庭记忆、个性化与RAG","chapters":[16,8,13],"summary":"让助手“记得这个家”：成员、房间、设备别名、作息偏好。RAG是把这些资料检索后交给模型的常用做法。","facts":[],"ai":"- **家庭知识的三类来源**：设备与房间拓扑（来自App/Matter）、用户明确告诉的偏好（“我女儿房间叫小星星房”）、行为统计（几点关灯）。\n- **RAG做法**：把说明书、设备清单、家庭规则切成小段建索引，问答时检索相关段落交给模型；适合“这台空调滤网怎么拆”“我家门锁电量多少”类问题。\n- **记忆治理**：用户可查看、修改、删除记忆；儿童相关信息默认更严格；敏感信息（健康、行踪）默认不长期保存。\n- **评测**：个性化是否带来错误（把访客当家人）、记忆过期（搬家、换设备）如何处理。","metrics":"","limits":"本专题暂未收录已核对的厂商来源，内容为方法归纳；涉及个人信息需遵守所在地个人信息保护法规。","qids":["1.2.3","22.7.5","1.2.5","18.6.4"],"qweak":true,"old_cases":[]},{"id":"XT-MATTER","title":"互联标准：Matter、Thread与桥接","chapters":[16,18,15],"summary":"AI中枢的价值取决于能控制多少设备。Matter降低了跨生态接入成本，摄像头在1.5版本入标。","facts":[{"t":"Matter 1.5（2025-11-20）加入摄像头（WebRTC、双向对讲、STUN/TURN、隐私区、本地或云端录像）、统一的Closures与能源管理设备类型。","src":["XS-06"]},{"t":"据报道SwitchBot AI Hub作为Matter桥接到Apple Home、Google Home、Alexa、SmartThings和Home Assistant，摄像头接入Apple Home需双方支持Matter 1.5。","src":["XS-10"]}],"ai":"- **产品决策**：做终端设备（被控）还是控制器/桥接（中枢）？中枢需要更多算力、长期软件投入。\n- **认证规划**：Matter认证+所在市场的无线认证；把认证时间放进项目计划关键路径。\n- **差异化**：标准化后基础控制同质化，差异回到AI理解、场景推荐和硬件体验（收音、显示、传感）。\n- **看板已有案例**：IKEA DIRIGERA从Matter桥接升级为控制器。","metrics":"","limits":"Matter版本特性与各平台支持进度不同步，规划前需核对目标平台的支持说明。","qids":["16.7.5","1.2.2","1.4.5","2.1.4","2.4.4","6.2.1"],"qweak":false,"old_cases":["HWCASE-IKEA"]},{"id":"XT-SENSE","title":"多模态感知与环境智能","chapters":[16,18,9],"summary":"从“你说我做”到“我看见、我先做”：摄像头、雷达、Wi-Fi感知让设备主动服务，也带来最强的隐私顾虑。","facts":[{"t":"Amazon Omnisense融合13MP摄像头、音频、超声波、Wi-Fi雷达、加速度计和Wi-Fi CSI，用于识别特定人后触发Routine等主动提醒。","src":["XS-02"]},{"t":"Matter 1.5摄像头规范包含侦测区与隐私区。","src":["XS-06"]},{"t":"据报道SwitchBot AI Hub用端侧VLM分析画面触发自动化。","src":["XS-10"]}],"ai":"- **传感器选型权衡**：摄像头信息最丰富但隐私顾虑最大；毫米波雷达可测存在与呼吸但无图像；Wi-Fi感知成本低但精度受环境影响。\n- **主动服务的边界**：先通知再执行，用户可一键关闭某类主动行为；误触发要可追溯（“为什么刚才开灯了”）。\n- **隐私设计**：物理遮挡/静音开关、状态灯、隐私区域、本地处理优先、仅上传事件或文字描述。","metrics":"","limits":"Amazon页面未说明Omnisense数据的隐私保护措施；传感器精度需按具体器件实测。","qids":["8.6.7","9.1.5","13.4.4","13.6.6","16.1.1","16.1.3"],"qweak":false,"old_cases":["HWCASE-PELOTON"]},{"id":"XT-OTA","title":"FOTA与模型升级：持续交付不翻车","chapters":[14,13,9],"summary":"AI硬件上市后体验主要靠升级持续改进，升级失败的代价是“变砖”和口碑崩塌。","facts":[{"t":"ESP-IDF OTA使用至少两个应用分区和otadata分区：新固件写入未运行的分区；开启回滚后，新固件首次启动须自检确认有效，否则重启后自动回退。","src":["XS-09"]},{"t":"ESP-IDF防回滚功能将安全版本号写入eFuse，阻止降级到旧版本；eFuse位不可恢复，可升级次数有限。启用安全启动时，签名校验失败会拒绝升级。","src":["XS-09"]}],"ai":"- **固件、模型、云端提示词分开升级**：模型文件大，单独分区或差分升级；云端提示词可随时回滚，但要有版本号便于追查。\n- **灰度发布**：1%→10%→50%→100%，每级设观察指标（启动成功率、崩溃率、唤醒率、投诉量）和自动暂停条件。\n- **失败预案**：A/B分区自动回滚、断电保护、低电量禁止升级。\n- **看板已有案例**：Sonos 2024 App改版、DJI Mavic 3固件与App协同、Pixel 8长期支持。","metrics":"| 阶段 | 比例 | 观察期 | 放量条件 | 自动暂停条件 |\n|---|---|---|---|---|\n| 内测 | 员工设备 | 3天 | 无P0问题 | 任一设备无法启动 |\n| 灰度1 | 1% | 2天 | 启动成功率不低于基线 | 回滚率超阈值 |\n| （示例，按项目替换） |  |  |  |  |","limits":"以乐鑫平台文档为例，其他芯片平台机制不同；灰度比例与观察期为示例值。","qids":["18.4.5","8.6.1","18.8.4","3.5.6","6.2.4","6.4.5"],"qweak":false,"old_cases":["HWCASE-SONOS","HWCASE-DJI","HWCASE-PIXEL"]},{"id":"XT-PRIV","title":"安全、隐私与合规（含AI监管）","chapters":[15,9,21],"summary":"常时聆听、带摄像头的AI家居设备，安全与隐私是上市门槛，不是加分项。","facts":[{"t":"欧盟《网络韧性法案》：已被利用漏洞和严重安全事件的报告义务自2026-09-11起适用（24小时预警、72小时通知），多数其他义务自2027-12-11起适用。","src":["XS-11"]},{"t":"美国白宫于2025-01-07宣布推出自愿性的U.S. Cyber Trust Mark，由FCC主管，覆盖婴儿监视器、家用摄像头、安防系统和语音助手等，依据NIST网络安全标准测试。","src":["XS-12"]},{"t":"中国《生成式人工智能服务管理暂行办法》自2023-08-15起施行，设立安全评估、算法备案、生成内容标识、投诉举报等制度。","src":["XS-13"]},{"t":"Google Home Speaker配有麦克风静音拨杆和显示聆听/思考/回应状态的灯环；Home Assistant称其Cloud不存储、不用语音数据训练。","src":["XS-04","XS-05"]}],"ai":"- **出海三件套**：无线/安全认证（如CE、FCC）+网络安全（欧盟CRA、美国Cyber Trust Mark）+数据合规（GDPR等）。\n- **国内大模型接入**：选用已完成备案的大模型服务，并在产品内落实内容标识与投诉渠道（以法律意见为准）。\n- **隐私设计清单**：物理静音、状态灯、本地处理优先、数据最小化、可删除语音记录、儿童模式、默认不长期保存原始音视频。\n- **安全支持期**：在包装或官网写明安全更新支持年限，并在BOM与云成本中预留。","metrics":"","limits":"法规描述来自监管或律所公开材料的摘要，不构成法律意见；具体义务以原文和专业律师意见为准。","qids":["8.6.6","16.3.4","17.5.3","21.5.2","18.7.5","18.7.6"],"qweak":false,"old_cases":["HWCASE-NEST"]},{"id":"XT-COST","title":"AI成本模型与商业模式","chapters":[10,5,7],"summary":"AI硬件和传统硬件最大的不同：卖出之后每天都在花钱。成本模型必须在立项时算清。","facts":[{"t":"Alexa+每月19.99美元，Prime会员免费。","src":["XS-01"]},{"t":"Google称Gemini Live属于付费订阅Google Home Premium，Gemini for Home分免费与付费版。","src":["XS-03","XS-04"]},{"t":"据报道SwitchBot AI Hub部分高级AI功能在试用期后需订阅。","src":["XS-10"]}],"ai":"**单设备月度AI成本（估算公式）**\n\n`月成本 = 日均对话轮数 × 30 × (每轮输入tokens × 输入单价 + 每轮输出tokens × 输出单价) + 日均语音分钟 × 30 × (ASR单价 + TTS单价) + 云存储/带宽`\n\n- **敏感性分析**：分别把对话轮数、tokens、单价上下浮动50%，看月成本变化，找出最敏感变量。\n- **重度用户问题**：前10%用户可能贡献大部分成本，需要限流、降级模型或订阅分层。\n- **生命周期视角**：设备生命周期×月成本 与 硬件毛利对比，决定是否需要订阅。\n- **降本手段**：离线命令词承接高频指令、语义缓存、按任务选择大小模型、端侧预处理。","metrics":"| 变量 | 示例假设 | 来源 | 敏感性 |\n|---|---|---|---|\n| 日均对话轮数 | 待调研 | 用户访谈/竞品 | 高 |\n| 每轮tokens | 待实测 | 原型日志 | 中 |\n| 模型单价 | 查官方价目 | 服务商官网（注明日期） | 高 |\n| （按项目填写） |  |  |  |","limits":"公式为教学模板，单价必须查服务商当日官方价目并注明日期。","qids":["7.2.1","5.2.1","5.2.2","5.2.3","5.2.4","7.2.2"],"qweak":false,"old_cases":["HWCASE-NEST","HWCASE-HUMANE"]}],"templates":[{"id":"TP-PRD","title":"PRD（AI硬件版）","phase":"立项–概念","owner":"产品经理","chapters":[3,2,18],"gjh":["GJH-CONCEPT","GJH-WHOLE","GJH-VALUE"],"purpose":"把用户需求、产品定位、功能、非功能要求和AI能力边界写成团队共识，是后续选型、测试和验收的依据。","md":"## 结构\n1. 背景与机会：目标用户、核心场景、为什么现在做\n2. 产品定位与价值主张：一句话卖点、与竞品差异\n3. 用户场景：按“谁、在哪、做什么、遇到什么问题”写3–5个核心场景\n4. 功能需求：每条带编号、优先级（P0/P1/P2）、验收标准\n5. **AI能力边界**：能做什么、不做什么；端侧/云端分工；断网可用功能；高风险操作确认规则\n6. 非功能需求：时延、功耗、续航、温升、可靠性、隐私、安全支持期\n7. 工业设计与交互：外观、材质、灯效、物理按键（静音键）\n8. 合规与认证目标市场\n9. 成本目标：BOM目标、单设备月度AI成本上限\n10. 里程碑与风险\n\n## 需求条目写法\n| 编号 | 需求 | 优先级 | 验收标准 | 来源 |\n|---|---|---|---|---|\n| FR-01 | 离线控制灯光 | P0 | 断网状态下离线命令词控制成功率达标（目标值见测试计划） | 用户访谈 |\n| NFR-03 | 物理静音 | P0 | 拨动后麦克风硬件断电，状态灯常亮提示 | 隐私要求 |\n| （示例行） |  |  |  |  |","check":["每条需求都有可测的验收标准","AI能力边界和“不做什么”写明","高风险操作的确认规则写明","成本目标包含持续AI成本"],"pitfalls":["只写功能不写验收标准","把“智能”“好用”当需求","忽略断网与云服务停运场景"],"qids":["1.2.4","1.2.1","3.1.3","3.3.1","2.5.1","3.3.5"]},{"id":"TP-RTM","title":"需求追踪矩阵（RTM）","phase":"立项–量产全程","owner":"产品经理 / 质量","chapters":[3,4,6],"gjh":["GJH-PROCESS"],"purpose":"把每条需求连到设计、测试用例和验证结果，保证“写了的需求都被做了、测了、通过了”。","md":"| 需求编号 | 需求摘要 | 设计对应 | 测试用例 | 阶段 | 结果 | 偏差/备注 |\n|---|---|---|---|---|---|---|\n| FR-01 | 离线控制灯光 | 固件：ESP-SR离线命令词 | TC-VOICE-011 | EVT | 通过/不通过 | — |\n| NFR-03 | 物理静音 | 硬件：麦克风供电开关 | TC-HW-020 | DVT | — | — |\n| （示例行） |  |  |  |  |  |  |\n\n## 使用规则\n- 需求变更必须同步更新矩阵，并记录变更原因和审批人。\n- 每个阶段评审前，统计“未覆盖需求”和“未通过用例”。","check":["P0需求100%有测试用例","每个阶段评审前更新结果列","变更有记录"],"pitfalls":["只在立项时做一次","测试用例与需求 <script>
(function(){
"use strict";
const D=JSON.parse(document.getElementById('data').textContent);
const IMG=JSON.parse(document.getElementById('imgdata').textContent);
const DATA_ROOT='./assets/hw-study-v2/';
const jobs=new Map(), loadedCh=new Set();
function loadJSON(name){
 if(!jobs.has(name)){
 const controller=new AbortController(), timeout=setTimeout(()=>controller.abort(),30000);
 const p=fetch(DATA_ROOT+name,{signal:controller.signal}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).finally(()=>clearTimeout(timeout)).catch(e=>{jobs.delete(name);throw e});
 jobs.set(name,p);
 }return jobs.get(name);
}
async function loadChapter(id){
 if(loadedCh.has(id))return;
 const rows=await loadJSON('q-'+id+'.json');
 if(!Array.isArray(rows)||rows.length!==(QByCh[id]||[]).length||rows.some(q=>!QS[q.id]||QS[q.id].c!==id||!Array.isArray(q.ans))){jobs.delete('q-'+id+'.json');throw Error('章节数据不完整')}
 rows.forEach(q=>Object.assign(QS[q.id],q));loadedCh.add(id);
}
let allJob;
function loadAllQuestions(){
 if(!allJob){const ids=D.chapters.map(c=>c.id);let i=0;
 allJob=Promise.all(Array.from({length:4},async()=>{while(i<ids.length){const id=ids[i++];await loadChapter(id)}})).catch(e=>{allJob=null;throw e});}
 return allJob;
}
let npdpReady=false;
async function loadNpdp(){
 if(npdpReady)return;
 const rows=await loadJSON('npdp.json');
 if(!Array.isArray(rows)||rows.length!==D.npdp.length||rows.some((n,i)=>n.p!==D.npdp[i].p||typeof n.b!=='string')){jobs.delete('npdp.json');throw Error('教材数据不完整')}
 rows.forEach((n,i)=>Object.assign(D.npdp[i],n));npdpReady=true;
}
const waitHtml='<p class="muted" role="status">正在加载正文，请稍候…</p>';
const errHtml='<p class="notice" role="alert">网络加载失败，请检查连接后重试。</p>';

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const PT={manufacturer:'厂商官方',regulator:'监管机构',repair_guide_provider:'维修指南'};
const ST=['未学习','学习中','已理解'];
const CH={},CS={},CK={},SR={},GS={},QS={};
D.chapters.forEach(c=>CH[c.id]=c); D.cases.forEach(c=>{CS[c.id]=c;CK[c.key]=c}); D.sources.forEach(s=>SR[s.id]=s);
D.gjh.sources.forEach(s=>GS[s.id]=s); D.questions.forEach(q=>QS[q.id]=q);
const QByCh={}; D.questions.forEach(q=>(QByCh[q.c]=QByCh[q.c]||[]).push(q));
const LByCh={},LByCase={}; D.links.forEach(l=>{(LByCh[l.chapter_id]=LByCh[l.chapter_id]||[]).push(l);(LByCase[l.case_id]=LByCase[l.case_id]||[]).push(l)});
const GRelCh={}; D.gjh.chapter_relations.forEach(r=>GRelCh[r.chapter_id]=r);
const GLinkTheory={}; D.gjh.chapter_course_links.forEach(l=>{(GLinkTheory[l.theory_id]=GLinkTheory[l.theory_id]||[]).push(l)});
const GLinkCase={}; D.gjh.case_course_links.forEach(l=>{(GLinkCase[l.case_id]=GLinkCase[l.case_id]||[]).push(l)});
const year=c=>c.event_date.slice(0,4);
const pad=n=>String(n).padStart(2,'0');
const isOv=h=>/^(case|gjh|npdp|xt|xp|xc|xq)-/.test(h);

/* ---------- store ---------- */
const KEY='hw-learning-board-v1';
let store={q:{},rel:{},x:{}}; let memOnly=false;
try{const r=localStorage.getItem(KEY); if(r) store=JSON.parse(r); store.q=store.q||{}; store.rel=store.rel||{}; store.x=store.x||{}}catch(e){memOnly=true}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){memOnly=true}}
const gq=id=>store.q[id]||{}; const gr=id=>store.rel[id]||{};
function sq(id,p){store.q[id]=Object.assign({},store.q[id],p);save();refreshProg()}
function sr(id,p){store.rel[id]=Object.assign({},store.rel[id],p);save()}
const stat=id=>gq(id).s||'未学习';

/* ---------- md ---------- */
function inl(s){return esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,a,b)=>'<span class="mono">'+(b||a)+'</span>')}
function md(src){
  const L=src.replace(/^---[\s\S]*?\n---\n/,'').split('\n');let o='',i=0,list=null;
  const close=()=>{if(list){o+='</'+list+'>';list=null}};
  while(i<L.length){const ln=L[i];
    if(/^\s*\|/.test(ln)&&/^\s*\|[\s:|-]+\|\s*$/.test(L[i+1]||'')){close();
      const row=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
      const h=row(ln);i+=2;let b='';
      while(i<L.length&&/^\s*\|/.test(L[i])){b+='<tr>'+row(L[i]).map(x=>'<td>'+inl(x)+'</td>').join('')+'</tr>';i++}
      o+='<div class="scroll"><table><thead><tr>'+h.map(x=>'<th>'+inl(x)+'</th>').join('')+'</tr></thead><tbody>'+b+'</tbody></table></div>';continue}
    let m;
    if(m=ln.match(/^(#{1,6})\s+(.*)/)){close();const n=Math.min(4,m[1].length+1);o+='<h'+n+'>'+inl(m[2])+'</h'+n+'>'}
    else if(m=ln.match(/^\s*[-*]\s+(.*)/)){if(list!=='ul'){close();o+='<ul>';list='ul'}o+='<li>'+inl(m[1])+'</li>'}
    else if(m=ln.match(/^\s*\d+[.、]\s+(.*)/)){if(list!=='ol'){close();o+='<ol>';list='ol'}o+='<li>'+inl(m[1])+'</li>'}
    else if(/^\s*$/.test(ln)){close()}
    else if(/^>/.test(ln)){close();o+='<p class="muted">'+inl(ln.replace(/^>\s*/,''))+'</p>'}
    else{close();o+='<p>'+inl(ln)+'</p>'}
    i++}
  close();return '<div class="md">'+o+'</div>'}

const TABS=[['overview','总览'],['cases','案例库'],['timeline','时间线'],['graph','关系图'],['method','高建华方法'],['theory','NPDP'],['search','题库搜索'],['expand','拓展'],['progress','进度']];
function renderRail(){
  $('#rail').innerHTML='<h4>22章目录</h4>'+D.chapters.map(c=>{const p=chProg(c.id);return '<a class="chl" href="#ch-'+c.id+'" data-ch="'+c.id+'"><span class="n">'+pad(c.id)+'</span><span>'+esc(c.title)+'</span><span class="p" data-prog-rail="'+c.id+'">'+p.u+'/'+p.n+'</span></a>'}).join('')}
function refreshProg(){
  D.chapters.forEach(c=>{const p=chProg(c.id);
    document.querySelectorAll('[data-prog-rail="'+c.id+'"]').forEach(e=>e.textContent=p.u+'/'+p.n);
    document.querySelectorAll('[data-prog-txt="'+c.id+'"]').forEach(e=>e.textContent='已理解 '+p.u+'/'+p.n);
    document.querySelectorAll('[data-prog-bar="'+c.id+'"]').forEach(e=>e.style.width=(p.n?p.u/p.n*100:0)+'%')});
  const e=$('#ov-u');if(e){let u=0;D.questions.forEach(q=>{if(stat(q.id)==='已理解')u++});e.textContent=u}}
function route(){
  const hs=location.hash.slice(1)||'overview';let m;
  if(isOv(hs)){
    if(!$('#main').innerHTML||$('#initialLoading'))render(hs.startsWith('gjh')?'method':hs.startsWith('npdp')?'theory':/^x[tc]-/.test(hs)?'expand-ai':/^xp-/.test(hs)?'expand-tpl':/^xq-/.test(hs)?'search':'cases');
    if(m=hs.match(/^case-(.+)$/))openCase(m[1]); else if(m=hs.match(/^gjh-(.+)$/))openGjh('GJH-'+m[1]); else if(m=hs.match(/^npdp-(\d+)$/))openNpdp(+m[1]); else if(m=hs.match(/^xt-(.+)$/))openXT(m[1]); else if(m=hs.match(/^xp-(.+)$/))openXP(m[1]); else if(m=hs.match(/^xc-(.+)$/))openXC(m[1]); else if(m=hs.match(/^xq-(.+)$/))openXQ(m[1]);
    return}
  $('#layer').innerHTML='';render(hs);window.scrollTo(0,0);$('#rail').classList.remove('open')}
function render(v){
  const main=$('#main');let m;
  document.querySelectorAll('#tabs .tab').forEach(b=>b.removeAttribute('aria-current'));
  document.querySelectorAll('.chl').forEach(a=>a.removeAttribute('aria-current'));
  if(m=v.match(/^ch-(\d+)$/)&&CH[+v.slice(3)]){main.innerHTML=vChapter(+v.slice(3));const a=document.querySelector('.chl[data-ch="'+v.slice(3)+'"]');a&&a.setAttribute('aria-current','page');return}
  if(/^expand(-|$)/.test(v)){main.innerHTML=vExpand(v.split('-')[1]);const te=document.querySelector('#tabs [data-go="expand"]');te&&te.setAttribute('aria-current','page');return}
  const map={overview:vOverview,cases:vCases,timeline:vTimeline,graph:vGraph,method:vMethod,theory:vTheory,search:vSearch,progress:vProgress};
  main.innerHTML=(map[v]||vOverview)();
  const t=document.querySelector('#tabs [data-go="'+(map[v]?v:'overview')+'"]');t&&t.setAttribute('aria-current','page');
  if(v==='cases')drawCases(); if(v==='method')drawMethods(); if(v==='search')drawSearch(); if(v==='theory')drawTheory()}
function go(h){remember();if(location.hash==='#'+h)route();else location.hash=h}

/* ---------- events ---------- */
$('#tabs').innerHTML=TABS.map(t=>'<button class="tab" data-go="'+t[0]+'">'+t[1]+'</button>').join('');
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-go]');if(!t)return;
  if(t.dataset.go){go(t.dataset.go);return}
  const a=t.dataset.act,k=t.dataset.k;
  if(a==='case')go('case-'+k);
  else if(a==='gjh')go('gjh-'+k.replace(/^GJH-/,''));
  else if(a==='npdp')go('npdp-'+k);
  else if(a==='xt'||a==='xp'||a==='xc'||a==='xq')go(a+'-'+k);
  else if(a==='retryroute')route();
  else if(a==='close')closeDrawer();
  else if(a==='rail')$('#rail').classList.toggle('open');
  else if(a==='theme'){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'}
  else if(a==='cfreset'){CF={q:'',y:'',t:'',s:'',c:'',p:''};render('cases')}
  else if(a==='gsel'){GSel=GSel===k?null:k;render('graph')}
  else if(a==='gclear'){GSel=null;render('graph')}
  else if(a==='glist'){GList=!GList;render('graph')}
  else if(a==='export'){$('#iobox').value=JSON.stringify({app:KEY,exported:new Date().toISOString(),data:store},null,1);$('#iomsg').textContent='已生成，请复制保存。'}
  else if(a==='copy'){const b=$('#iobox');if(!b.value)b.value=JSON.stringify({app:KEY,exported:new Date().toISOString(),data:store},null,1);b.select();(navigator.clipboard?navigator.clipboard.writeText(b.value):Promise.reject()).then(()=>$('#iomsg').textContent='已复制。',()=>$('#iomsg').textContent='已选中文本，请手动复制。')}
  else if(a==='import')doImport($('#iobox').value);
  else if(a==='resetask')$('#resetbox').innerHTML='<p style="margin:0 0 8px">确认清空全部学习状态、作答、笔记和复习日期？此操作不能撤销，建议先导出。</p><button class="btn pri" data-act="resetdo">确认清空</button> <button class="btn" data-act="resetcancel">取消</button>';
  else if(a==='resetcancel')render('progress');
  else if(a==='resetdo'){store={q:{},rel:{},x:{}};save();renderRail();render('progress');refreshProg()}
});
function doImport(txt){
  const msg=$('#iomsg');
  try{const o=JSON.parse(txt);const d=o.data||o;if(!d||typeof d!=='object'||(!d.q&&!d.rel&&!d.x))throw 0;
    const q={},r={};Object.keys(d.q||{}).forEach(k=>{if(QS[k])q[k]=d.q[k]});Object.keys(d.rel||{}).forEach(k=>{if(D.links.some(l=>l.id===k))r[k]=d.rel[k]});
    const xx={};Object.keys(d.x||{}).forEach(k=>{if(XPJ[k])xx[k]=d.x[k]});store={q,rel:r,x:xx};save();renderRail();refreshProg();msg.textContent='已导入 '+Object.keys(q).length+' 题记录、'+Object.keys(r).length+' 条练习记录、'+Object.keys(xx).length+' 条贯通项目记录。'}
  catch(x){msg.textContent='导入失败：内容不是本看板导出的JSON。'}}

  else if(b==='xst'){sx(t.dataset.id,{s:t.value});t.dataset.v=t.value}
  else if(t.id==='qs'){$('#qlist').innerHTML=qListHtml(+(location.hash.match(/ch-(\d+)/)||[])[1],$('#qf').value,t.value)}
  else if(t.id==='cy'||t.id==='ct'||t.id==='cs'||t.id==='cc'||t.id==='cp'){CF[{cy:'y',ct:'t',cs:'s',cc:'c',cp:'p'}[t.id]]=t.value;drawCases()}
  else if(t.id==='sscope'){SF.scope=t.value;drawSearch()} else if(t.id==='sch'){SF.ch=t.value;drawSearch()}
});
document.addEventListener('input',e=>{
  const t=e.target,b=t.dataset&&t.dataset.bind;
  if(b==='relans')sr(t.dataset.id,{ans:t.value}); else if(b==='qnote')sq(t.dataset.id,{n:t.value}); else if(b==='xnote')sx(t.dataset.id,{n:t.value});
  else if(t.id==='qf')$('#qlist').innerHTML=qListHtml(+(location.hash.match(/ch-(\d+)/)||[])[1],t.value,$('#qs').value);
  else if(t.id==='cq'){CF.q=t.value;drawCases()} else if(t.id==='mq'){MF=t.value;drawMethods()}
  else if(t.id==='sq'){SF.q=t.value;drawSearch()} else if(t.id==='nq'){NQ=t.value;drawTheory()}
});
document.addEventListener('toggle',async e=>{
 const d=e.target;if(!d.matches||!d.matches('details.q[data-qid]')||!d.open)return;
 const b=d.querySelector('.qbody'),q=QS[d.dataset.qid];if(!q||b.dataset.ready==='1'||b.dataset.loading==='1')return;
 b.dataset.loading='1';b.innerHTML=waitHtml;
 try{await loadChapter(q.c);if(b.isConnected){b.innerHTML=qBody(q);b.dataset.ready='1'}}catch(e){if(b.isConnected)b.innerHTML=errHtml+'<p class="muted">合上并重新展开题目即可重试。</p>'}finally{delete b.dataset.loading}
},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('.drawer'))closeDrawer();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('g.gn')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
});
window.addEventListener('hashchange',route);
try{renderRail();route()}catch(e){const main=$('#main');if(main)main.innerHTML='<div class="card"><p role="alert">初始化失败，请刷新页面重试。</p><a href="./">返回看板中心</a></div>';throw e}
})();
</script>
